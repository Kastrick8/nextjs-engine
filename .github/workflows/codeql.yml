name: CodeQL

on:
  push:
    branches: [main-2, main-3]
  pull_request:
    branches: [main-2, main-3]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Collect SARIF for diagnosis
        if: always()
        shell: bash
        run: |
          mkdir -p .codeql-debug
          index=0
          while IFS= read -r -d '' file; do
            index=$((index + 1))
            cp "$file" ".codeql-debug/result-$index.sarif"
          done < <(find "$RUNNER_TEMP" "$GITHUB_WORKSPACE/.." -maxdepth 7 -type f -name '*.sarif' -print0 2>/dev/null)
      - name: Upload CodeQL SARIF diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: .codeql-debug/*.sarif
          if-no-files-found: warn
