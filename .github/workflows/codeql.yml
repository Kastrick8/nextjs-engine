name: CodeQL

on:
  push:
    branches: [main-2, main-3]
  pull_request:
    branches: [main-2, main-3]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
      code-quality: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
      - name: Report open CodeQL security alerts
        if: matrix.language == 'actions'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Open CodeQL security alerts (number, rule, severity, path, start/end lines, message):"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | [(.number | tostring), .rule.id, (.rule.security_severity_level // .rule.severity // "unknown"), (.most_recent_instance.location.path // "unknown-path"), ((.most_recent_instance.location.start_line // 0) | tostring), ((.most_recent_instance.location.end_line // .most_recent_instance.location.start_line // 0) | tostring), (.most_recent_instance.message.text // .rule.description // "")] | @tsv'
      - name: Report open Code Quality findings
        if: matrix.language == 'actions'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Open Code Quality findings (number, rule, title, severity, category, path, start/end lines, message):"
          gh api --paginate -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${GITHUB_REPOSITORY}/code-quality/findings?state=open&per_page=100" \
            --jq '.[] | [(.number | tostring), .rule.id, .rule.title, .rule.severity, .rule.category, .location.path, ((.location.start_line // 0) | tostring), ((.location.end_line // .location.start_line // 0) | tostring), (.message.text // .rule.description // "")] | @tsv'
