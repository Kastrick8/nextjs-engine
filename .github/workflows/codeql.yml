name: CodeQL

on:
  push:
    branches: [main-2, main-3]
  pull_request:
    branches: [main-2, main-3]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
      - name: Report open CodeQL security alerts
        if: matrix.language == 'actions'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in refs/heads/main-2 refs/heads/main-3 refs/pull/79/merge; do
            echo "Open CodeQL alerts for $ref:"
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100&ref=$ref" \
              --jq '.[] | [(.number | tostring), .rule.id, (.rule.security_severity_level // .rule.severity // "unknown"), (.most_recent_instance.ref // "unknown-ref"), (.most_recent_instance.location.path // "unknown-path"), ((.most_recent_instance.location.start_line // 0) | tostring)] | @tsv' || true
          done
          echo "Detailed insecure-temporary-file findings for this PR merge ref:"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100&ref=refs/pull/79/merge" \
            --jq '.[] | select(.rule.id == "js/insecure-temporary-file") | {number, rule: {id: .rule.id, description: .rule.description, help: .rule.help, severity: .rule.security_severity_level}, message: .most_recent_instance.message.text, location: .most_recent_instance.location, related_locations: .most_recent_instance.related_locations}' || true

