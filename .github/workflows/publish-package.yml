name: Publish versioned package

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Publish an existing archived snapshot, or create a snapshot from a pinned source commit"
        required: true
        type: choice
        options: [source, archive]
        default: source
      source_branch:
        description: "Development branch containing the pinned source commit (source mode only)"
        required: false
        type: choice
        options: [main-2, main-3]
        default: main-3
      source_commit:
        description: "Exact 40-character source commit SHA to pin (required for source mode); recorded in UPSTREAM.md"
        required: false
        type: string
      version:
        description: "Source mode reads this from the pinned source package.json; archive mode requires this value"
        required: false
        type: string
      snapshot_action:
        description: "Source mode only: create a snapshot or refresh an existing unpublished alpha snapshot"
        type: choice
        options: [create, refresh]
        default: create
      track:
        description: "Stable releases auto-run on main-2; alpha/beta releases are manual"
        required: true
        type: choice
        options: [stable, alpha, beta]
  # Automatic npm publishing is stable-only. Generation 3 prereleases are dispatched manually.
  workflow_run:
    workflows:
      - "Engine runtime CI"
    types: [completed]
    branches: [main-2]
  push:
    tags:
      - "package.[0-9]*"
      - "package-alpha.[0-9]*"
      - "package-beta.[0-9]*"
  repository_dispatch:
    types: [package-snapshot-published]

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  # Serialize all publishers by dist-tag track, including main-2/main-3
  # workflow_run promotions and immutable package tag events.
  group: npm-release-${{ inputs.track || (startsWith(github.ref_name, 'package-alpha.') && 'alpha') || (startsWith(github.ref_name, 'package-beta.') && 'beta') || (startsWith(github.event.client_payload.tag_name, 'package-alpha.') && 'alpha') || (startsWith(github.event.client_payload.tag_name, 'package-beta.') && 'beta') || (github.event.workflow_run.head_branch == 'main-2' && 'stable') || 'alpha' }}
  cancel-in-progress: false

jobs:
  gate-auto-release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main-2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout the exact CI-tested source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check package changes and wait for browser CI
        id: gate
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Only publish commits that can change the package snapshot.
          if git -C source rev-parse "$SOURCE_SHA^1" >/dev/null 2>&1; then
            git -C source diff --name-only "$SOURCE_SHA^1" "$SOURCE_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git -C source ls-tree -r --name-only "$SOURCE_SHA" > "$RUNNER_TEMP/changed-files.txt"
          fi

          node - "$RUNNER_TEMP/changed-files.txt" <<'NODE'
          const fs = require("node:fs");
          const files = fs.readFileSync(process.argv[2], "utf8").split(/\r?\n/).filter(Boolean);
          const isPackageFile = (file) =>
            /^(src\/engine\/|engine\/|docs\/)/.test(file) ||
            file === "package.json" || file === "README.md" || file === "DOCUMENT.md";
          const relevant = files.filter(isPackageFile);
          if (!relevant.length) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
            console.log("No distributable engine or documentation files changed; skipping npm release.");
            process.exit(0);
          }
          console.log("Package-relevant changes:");
          for (const file of relevant) console.log(" - " + file);
          NODE

          if grep -Fqx 'publish=false' "$GITHUB_OUTPUT"; then exit 0; fi

          if [[ "$SOURCE_BRANCH" != "main-2" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Only main-2 stable releases are automatic; alpha releases must be dispatched manually."
            exit 0
          fi
          BROWSER_WORKFLOW="Engine browser compatibility"

          echo "Waiting for '$BROWSER_WORKFLOW' to pass for $SOURCE_BRANCH@$SOURCE_SHA."
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" \
              > "$RUNNER_TEMP/actions-runs.json"

            RESULT="$(node - "$SOURCE_BRANCH" "$SOURCE_SHA" "$BROWSER_WORKFLOW" "$RUNNER_TEMP/actions-runs.json" <<'NODE'
          const fs = require("node:fs");
          const [branch, sha, workflow, file] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const matches = (payload.workflow_runs || [])
            .filter((run) => run.name === workflow && run.head_branch === branch && run.head_sha === sha && run.event === "push")
            .sort((a, b) => Date.parse(b.run_started_at || b.created_at || 0) - Date.parse(a.run_started_at || a.created_at || 0));
          if (!matches.length || matches[0].status !== "completed") {
            console.log("pending");
          } else if (matches[0].conclusion === "success") {
            console.log("success");
          } else {
            console.log("failure:" + String(matches[0].conclusion || "unknown"));
          }
          NODE
            )"

            case "$RESULT" in
              success)
                # The source manifest is authoritative. Never mint a second tarball for a published version.
                SOURCE_VERSION="$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("source/package.json","utf8"));if(typeof p.version!=="string"||!p.version)process.exit(1);process.stdout.write(p.version)')"
                if [[ ! "$SOURCE_VERSION" =~ ^2\.[0-9]+\.[0-9]+$ ]]; then
                  echo "publish=false" >> "$GITHUB_OUTPUT"
                  echo "::warning::main-2 package.json must contain a stable 2.x.y version; found '$SOURCE_VERSION'."
                  exit 0
                fi
                if ! npm view @kastrick/nextjs-engine versions --json > "$RUNNER_TEMP/npm-versions.json"; then
                  echo "publish=false" >> "$GITHUB_OUTPUT"
                  echo "::warning::Could not verify npm registry versions; failing closed and skipping release."
                  exit 0
                fi
                if node - "$SOURCE_VERSION" "$RUNNER_TEMP/npm-versions.json" <<'NODE'
          const fs = require("node:fs");
          const [version, file] = process.argv.slice(2);
          const raw = JSON.parse(fs.readFileSync(file, "utf8"));
          const versions = Array.isArray(raw) ? raw : [raw];
          process.exit(versions.map(String).includes(version) ? 0 : 1);
          NODE
                then
                  echo "publish=false" >> "$GITHUB_OUTPUT"
                  echo "::notice::@kastrick/nextjs-engine@$SOURCE_VERSION already exists on npm; bump main-2 package.json before the next stable publication."
                  exit 0
                fi
                echo "publish=true" >> "$GITHUB_OUTPUT"
                echo "Engine runtime CI and same-commit browser CI passed; package.json version $SOURCE_VERSION is not yet published."
                exit 0
                ;;
              failure:*)
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::warning::Browser compatibility did not pass ($RESULT); npm release skipped."
                exit 0
                ;;
              pending)
                echo "Browser compatibility is queued or running (attempt $attempt/60)."
                sleep 20
                ;;
            esac
          done

          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Browser compatibility did not finish within 20 minutes; npm release skipped."

  release-from-source:
    needs: gate-auto-release
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.release_mode == 'source') || (github.event_name == 'workflow_run' && needs.gate-auto-release.outputs.publish == 'true')) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive branch
        uses: actions/checkout@v6
        with:
          ref: package/main
          path: archive
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact pinned source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit || github.event.workflow_run.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: |
            scripts/gen3-assert-green-commit.js
            .github/scripts/copy-content-includes.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false



      - name: Test content.include helper
        run: node tooling/.github/scripts/copy-content-includes.js --self-test

      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0

      - name: Resolve release settings
        id: release-meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_SNAPSHOT_ACTION: ${{ inputs.snapshot_action }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SNAPSHOT_ACTION="$INPUT_SNAPSHOT_ACTION"
          if [[ -z "$SNAPSHOT_ACTION" ]]; then SNAPSHOT_ACTION="create"; fi
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            SOURCE_BRANCH="$EVENT_BRANCH"
            SOURCE_COMMIT="$EVENT_SHA"
            TRACK="stable"
            SNAPSHOT_ACTION="create"
          else
            SOURCE_BRANCH="$INPUT_SOURCE_BRANCH"
            SOURCE_COMMIT="$INPUT_SOURCE_COMMIT"
            TRACK="$INPUT_TRACK"
          fi

          # Source-mode releases always take their version from the exact checked-out commit.
          VERSION="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("source/package.json","utf8")); if(typeof p.version!=="string"||!p.version) process.exit(1); process.stdout.write(p.version)')"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$VERSION" ]]; then
            echo "The requested version $INPUT_VERSION does not match source/package.json ($VERSION). Update the source manifest or leave the optional version field empty." >&2
            exit 1
          fi

          case "$TRACK" in
            stable)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable source package.json must contain a stable SemVer version, got: $VERSION" >&2; exit 1; }
              ;;
            alpha)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]] || { echo "Alpha source package.json must contain a version like 3.0.0-alpha.1, got: $VERSION" >&2; exit 1; }
              ;;
            beta)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Beta source package.json must contain a version like 3.0.0-beta.1, got: $VERSION" >&2; exit 1; }
              ;;
            *)
              echo "track must be stable, alpha, or beta." >&2
              exit 1
              ;;
          esac

          if [[ "$SNAPSHOT_ACTION" == "refresh" ]]; then
            [[ "$EVENT_NAME" == "workflow_dispatch" && "$TRACK" == "alpha" ]] || {
              echo "Refresh mode is restricted to manual alpha releases." >&2
              exit 1
            }
          elif [[ "$SNAPSHOT_ACTION" != "create" ]]; then
            echo "snapshot_action must be create or refresh." >&2
            exit 1
          fi
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a lowercase 40-character SHA." >&2; exit 1; }
          [[ -n "$VERSION" && -n "$TRACK" && -n "$SOURCE_BRANCH" ]] || { echo "Release version, track, and source branch are required." >&2; exit 1; }

          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "snapshot_action=$SNAPSHOT_ACTION" >> "$GITHUB_OUTPUT"
          echo "Release selected: $VERSION ($TRACK, snapshot action: $SNAPSHOT_ACTION) from $SOURCE_BRANCH@$SOURCE_COMMIT"

      - name: Validate source pin and prepare immutable snapshot
        id: prepare
        shell: bash
        env:
          SOURCE_BRANCH: ${{ steps.release-meta.outputs.source_branch }}
          SOURCE_COMMIT: ${{ steps.release-meta.outputs.source_commit }}
          VERSION: ${{ steps.release-meta.outputs.version }}
          TRACK: ${{ steps.release-meta.outputs.track }}
          SNAPSHOT_ACTION: ${{ steps.release-meta.outputs.snapshot_action }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("source/package.json","utf8")); if(typeof p.version!=="string"||!p.version) process.exit(1); process.stdout.write(p.version)')"
          if [[ -n "${INPUT_VERSION:-}" && "${INPUT_VERSION:-}" != "$VERSION" ]]; then
            echo "Requested version $INPUT_VERSION does not match the pinned source package.json version $VERSION." >&2
            exit 1
          fi
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a lowercase 40-character SHA." >&2; exit 1; }
          PINNED_SHA="$(git -C source rev-parse HEAD)"
          [[ "$PINNED_SHA" == "$SOURCE_COMMIT" ]] || { echo "Checked-out commit does not match requested pin." >&2; exit 1; }

          git -C archive fetch --no-tags origin "$SOURCE_BRANCH"
          git -C archive merge-base --is-ancestor "$PINNED_SHA" FETCH_HEAD || {
            echo "Pinned commit is not reachable from $SOURCE_BRANCH." >&2
            exit 1
          }
          git -C archive fetch --no-tags origin refs/heads/package/main:refs/remotes/origin/package/main
          git -C archive switch --force-create package/main origin/package/main

          if [[ "$TRACK" == "alpha" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)$ ]] || { echo "Alpha versions must look like 3.0.0-alpha.2." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            FAMILY="$MAJOR.alpha"
            TARGET="alpha/version/$FAMILY/version/$VERSION"
            FAMILY_DIR="archive/alpha/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            else
              TEMPLATE_DIR="archive/alpha/version/3.alpha/version/3.0.0-alpha.1"
            fi
          elif [[ "$TRACK" == "beta" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]] || { echo "Beta versions must look like 3.0.0-beta.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            FAMILY="$MAJOR.beta"
            TARGET="beta/version/$FAMILY/version/$VERSION"
            FAMILY_DIR="archive/beta/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            else
              TEMPLATE_DIR="archive/alpha/version/3.alpha/version/3.0.0-alpha.1"
            fi
          elif [[ "$TRACK" == "stable" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Stable versions must look like 2.6.3." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            FAMILY="$MAJOR.$MINOR"
            SNAPSHOT="$VERSION"
            if [[ "$PATCH" == "0" ]]; then SNAPSHOT="$FAMILY"; fi
            TARGET="version/$FAMILY/version/$SNAPSHOT"
            FAMILY_DIR="archive/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            elif [[ "$MAJOR" == "1" ]]; then
              TEMPLATE_DIR="archive/version/1.0/version/1.0"
            else
              TEMPLATE_DIR="archive/version/2.6/version/2.6.2"
            fi
          else
            echo "track must be stable, alpha, or beta." >&2
            exit 1
          fi

          [[ -f "$TEMPLATE_DIR/package.json" && -f "$TEMPLATE_DIR/tsconfig.json" ]] || { echo "Manifest template missing at $TEMPLATE_DIR." >&2; exit 1; }
          REUSE_EXISTING=false
          REFRESHED=false
          TEMPLATE_PROVENANCE="$TEMPLATE_DIR"
          if [[ -e "archive/$TARGET" ]]; then
            if [[ "$SNAPSHOT_ACTION" == "refresh" || "$EVENT_NAME" == "workflow_run" ]]; then
              if [[ "$EVENT_NAME" == "workflow_run" ]]; then
                [[ "$TRACK" == "stable" ]] || { echo "Automatic refresh is restricted to stable releases." >&2; exit 1; }
              else
                [[ "$TRACK" == "alpha" ]] || { echo "Manual refresh is restricted to alpha snapshots." >&2; exit 1; }
              fi
              [[ -f "archive/$TARGET/package.json" && -f "archive/$TARGET/UPSTREAM.md" ]] || {
                echo "Refresh requires an existing snapshot with package.json and UPSTREAM.md." >&2
                exit 1
              }

              # Fail closed if npm metadata cannot be checked. A published version is immutable.
              npm view @kastrick/nextjs-engine versions --json > "$RUNNER_TEMP/npm-versions.json"
              node - "$VERSION" "$RUNNER_TEMP/npm-versions.json" <<'NODE'
          const fs = require("node:fs");
          const [version, versionsPath] = process.argv.slice(2);
          const raw = JSON.parse(fs.readFileSync(versionsPath, "utf8"));
          const versions = Array.isArray(raw) ? raw : [raw];
          if (versions.map(String).includes(version)) {
            throw new Error("@kastrick/nextjs-engine@" + version + " is already published to npm and cannot be replaced. Bump source/package.json before publishing new code.");
          }
          NODE

              mkdir -p "$RUNNER_TEMP/package-template"
              cp -a "$TEMPLATE_DIR/." "$RUNNER_TEMP/package-template/"
              TEMPLATE_DIR="$RUNNER_TEMP/package-template"
              rm -rf "archive/$TARGET"
              REFRESHED=true
              echo "Refreshing unpublished $TRACK snapshot $VERSION from source commit $PINNED_SHA."
            else
              [[ -f "archive/$TARGET/UPSTREAM.md" ]] || { echo "Snapshot exists without provenance; refusing to overwrite." >&2; exit 1; }
              grep -Fq -- "- Requested and resolved source commit: $PINNED_SHA" "archive/$TARGET/UPSTREAM.md" || {
                echo "Snapshot already exists with different or unknown provenance; use snapshot_action=refresh only if the npm version has not been published." >&2
                exit 1
              }
              REUSE_EXISTING=true
            fi
          elif [[ "$SNAPSHOT_ACTION" == "refresh" ]]; then
            echo "No existing snapshot exists at archive/$TARGET; use snapshot_action=create instead." >&2
            exit 1
          fi

          # A missing archive must not be reconstructed from a version that already exists on npm.
          # Refresh paths have already performed this check above, before deleting the old snapshot.
          if [[ "$REUSE_EXISTING" != "true" && "$SNAPSHOT_ACTION" != "refresh" && ! -e "archive/$TARGET" ]]; then
            npm view @kastrick/nextjs-engine versions --json > "$RUNNER_TEMP/npm-versions.json"
            node - "$VERSION" "$RUNNER_TEMP/npm-versions.json" <<'NODE'
          const fs = require("node:fs");
          const [version, versionsPath] = process.argv.slice(2);
          const raw = JSON.parse(fs.readFileSync(versionsPath, "utf8"));
          const versions = Array.isArray(raw) ? raw : [raw];
          if (versions.map(String).includes(version)) {
            throw new Error("@kastrick/nextjs-engine@" + version + " is already published; refusing to create a different archive for the same version.");
          }
          NODE
          fi

          if [[ "$REUSE_EXISTING" != "true" ]]; then
            if [[ -d source/src/engine ]]; then ENGINE_DIR="source/src/engine"
            elif [[ -d source/engine ]]; then ENGINE_DIR="source/engine"
            else echo "Pinned source has neither src/engine/ nor engine/; refusing to guess." >&2; exit 1
            fi
            DEST="archive/$TARGET"
            if [[ "$TRACK" == "alpha" || "$TRACK" == "beta" || "$VERSION" =~ ^2\.7\.[0-9]+$ ]]; then
              test -f "source/bin/ne.js" || { echo "This release requires the NE CLI, but source/bin/ne.js is missing." >&2; exit 1; }
            fi
            mkdir -p "$DEST/engine"
            cp "$TEMPLATE_DIR/package.json" "$DEST/package.json"
            cp "$TEMPLATE_DIR/tsconfig.json" "$DEST/tsconfig.json"
            for file in README.md DOCUMENT.md; do
              if [[ -f "$TEMPLATE_DIR/$file" ]]; then cp "$TEMPLATE_DIR/$file" "$DEST/$file"; fi
              if [[ -f "source/$file" ]]; then cp "source/$file" "$DEST/$file"; fi
            done
            if [[ -d "$TEMPLATE_DIR/docs" ]]; then
              mkdir -p "$DEST/docs"
              cp -a "$TEMPLATE_DIR/docs/." "$DEST/docs/"
            fi
            if [[ -d source/docs ]]; then
              rm -rf "$DEST/docs"
              cp -a source/docs "$DEST/docs"
            fi
            cp -a "$ENGINE_DIR/." "$DEST/engine/"
            printf '%s\n' 'export * from "./engine";' > "$DEST/index.ts"
            INCLUDED_CONTENT_PATHS="$(node tooling/.github/scripts/copy-content-includes.js source "$DEST" --legacy-bin)"
            export CONTENT_INCLUDE_PATHS="$INCLUDED_CONTENT_PATHS"
            if [[ "$TRACK" == "alpha" || "$TRACK" == "beta" || "$VERSION" =~ ^2\.7\.[0-9]+$ ]]; then
              test -f "$DEST/bin/ne.js" || { echo "This release requires the NE CLI; add bin/ to source/content.include." >&2; exit 1; }
            fi
            export TARGET VERSION TRACK PINNED_SHA SOURCE_BRANCH ENGINE_DIR TEMPLATE_DIR TEMPLATE_PROVENANCE
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const {TARGET,VERSION,TRACK,PINNED_SHA,SOURCE_BRANCH,ENGINE_DIR,TEMPLATE_DIR,TEMPLATE_PROVENANCE}=process.env;
          const root="archive/"+TARGET;
          const manifest=JSON.parse(fs.readFileSync(root+"/package.json","utf8"));
          manifest.name="@kastrick/nextjs-engine";
          manifest.version=VERSION;
          manifest.private=false;
          manifest.repository={type:"git",url:"git+https://github.com/Kastrick8/nextjs-engine.git"};
          manifest.homepage="https://github.com/Kastrick8/nextjs-engine#readme";
          manifest.files=(manifest.files||[]).filter(p=>p!=="content.include"&&fs.existsSync(root+"/"+p));
          const includedPaths=JSON.parse(process.env.CONTENT_INCLUDE_PATHS||"[]");
          for(const included of includedPaths){
            if(fs.existsSync(root+"/"+included)&&!manifest.files.includes(included)) manifest.files.push(included);
          }
          const sourceManifest=JSON.parse(fs.readFileSync("source/package.json","utf8"));
          const bins={};
          for(const [name,target] of Object.entries(sourceManifest.bin||{})){
            if(typeof target!=="string") continue;
            const relative=target.replace(/^\.\//,"");
            const included=includedPaths.some(p=>relative===p||relative.startsWith(p+"/"));
            if(included&&fs.existsSync(root+"/"+relative)) bins[name]="./"+relative;
          }
          if(Object.keys(bins).length) manifest.bin=bins;
          else delete manifest.bin;
          if(fs.existsSync(root+"/content.include")) fs.rmSync(root+"/content.include",{force:true});
          for(const [name,value] of Object.entries(manifest.exports||{})){
            if(name===".") continue;
            const targets=typeof value==="string"?[value]:[value.types,value.import,value.require,value.default].filter(Boolean);
            if(targets.some(p=>!fs.existsSync(root+"/"+p.replace(/^\.\//,"")))) delete manifest.exports[name];
          }
          fs.writeFileSync(root+"/package.json",JSON.stringify(manifest,null,"\t")+"\n");
          const provenance=[
            "# Snapshot provenance",
            "",
            "- Full package version: "+VERSION,
            "- Package: @kastrick/nextjs-engine",
            "- Archive track: "+TRACK,
            "- Source branch: "+SOURCE_BRANCH,
            "- Requested and resolved source commit: "+PINNED_SHA,
            "- Engine source path: "+ENGINE_DIR,
            "- Manifest/docs template: "+(TEMPLATE_PROVENANCE||TEMPLATE_DIR),
            "",
            "The engine source was copied from the exact pinned commit above. The source manifest supplied the version; the package name was normalized for the Kastrick npm package. Missing optional export targets were removed. Published npm versions are immutable; unpublished snapshots may be refreshed only through the guarded workflow path.",
            ""
          ].join("\n");
          fs.writeFileSync(root+"/UPSTREAM.md",provenance);
          NODE
          fi

          node - "$TARGET" "$VERSION" <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const target=process.argv[2], version=process.argv[3];
          const p=JSON.parse(fs.readFileSync(path.join("archive",target,"package.json"),"utf8"));
          if(p.name!=="@kastrick/nextjs-engine"||p.version!==version) throw new Error("Manifest name/version mismatch: "+p.name+"@"+p.version);
          if(p.repository?.url!=="git+https://github.com/Kastrick8/nextjs-engine.git"||p.homepage!=="https://github.com/Kastrick8/nextjs-engine#readme") throw new Error("Snapshot repository metadata is not canonical.");
          for(const f of ["index.ts","engine/index.ts","tsconfig.json"]) if(!fs.existsSync(path.join("archive",target,f))) throw new Error("Missing "+f);
          if(version.startsWith("2.7.")){
            if(p.bin?.ne!=="./bin/ne.js"||!p.files?.includes("bin")||!fs.existsSync(path.join("archive",target,"bin","ne.js"))) throw new Error("The v2.7 stable snapshot must ship the ne executable.");
          }
          const expected=(version.includes("-alpha.")||version.includes("-beta."))?version:(version.endsWith(".0")?version.split(".").slice(0,2).join("."):version);
          if(path.basename(target)!==expected) throw new Error("Snapshot path does not match "+version);
          NODE
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "pinned_sha=$PINNED_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "reuse_existing=$REUSE_EXISTING" >> "$GITHUB_OUTPUT"
          echo "refreshed=$REFRESHED" >> "$GITHUB_OUTPUT"

      - name: Require green runtime and browser CI for prereleases
        if: ${{ inputs.track == 'alpha' || inputs.track == 'beta' }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Type-check and inspect packed contents
        working-directory: archive/${{ steps.prepare.outputs.target }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          if [[ -f bin/ne.js ]]; then
            node bin/ne.js --help >/dev/null
          fi
          npm run pack:check
          rm -rf node_modules

      - name: Commit the snapshot to package/main
        working-directory: archive
        env:
          TARGET: ${{ steps.prepare.outputs.target }}
          VERSION: ${{ steps.release-meta.outputs.version }}
          PINNED_SHA: ${{ steps.prepare.outputs.pinned_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "Release @kastrick/nextjs-engine $VERSION from $PINNED_SHA"
            git push origin HEAD:refs/heads/package/main
          fi

      - name: Create package-root commit and push the version tag
        id: create-tag
        working-directory: archive
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          TRACK: ${{ steps.release-meta.outputs.track }}
          PINNED_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          TARGET: ${{ steps.prepare.outputs.target }}
          REFRESHED: ${{ steps.prepare.outputs.refreshed }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TRACK" in
            stable) TAG="package.$VERSION" ;;
            alpha) TAG="package-alpha.$VERSION" ;;
            beta) TAG="package-beta.$VERSION" ;;
            *) echo "Unsupported track: $TRACK" >&2; exit 1 ;;
          esac

          git fetch --no-tags origin refs/heads/package/main:refs/remotes/origin/package/main
          ARCHIVE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$(git rev-parse refs/remotes/origin/package/main)" != "$ARCHIVE_COMMIT" ]]; then
            echo "package/main does not point at the just-created archive snapshot; refusing to tag a stale commit." >&2
            exit 1
          fi

          RESULT="$(node .github/scripts/package-root-git-tags.mjs create "$GITHUB_WORKSPACE/archive" "$TARGET" "$ARCHIVE_COMMIT" "$VERSION" "$TRACK" "$PINNED_SHA" "$TAG")"
          NEW_PACKAGE_SHA="$(printf '%s' "$RESULT" | node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(0,"utf8"));if(!/^[0-9a-f]{40}$/.test(x.commitSha||""))throw new Error("Invalid package-root commit SHA");process.stdout.write(x.commitSha)')"
          test -n "$NEW_PACKAGE_SHA"
          git cat-file -e "$NEW_PACKAGE_SHA:package.json"
          git cat-file -e "$NEW_PACKAGE_SHA:engine/index.ts"
          git cat-file -e "$NEW_PACKAGE_SHA:.package-tag.json"

          PUSH_TAG=false
          PACKAGE_SHA="$NEW_PACKAGE_SHA"
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            EXISTING_COMMIT="$(git rev-parse "$TAG^{commit}")"
            if [[ "$REFRESHED" == "true" ]]; then
              # Refresh is only allowed by the earlier registry guard for an unpublished snapshot.
              PUSH_TAG=true
            elif git cat-file -e "$EXISTING_COMMIT:.package-tag.json" 2>/dev/null; then
              git show "$EXISTING_COMMIT:.package-tag.json" > "$RUNNER_TEMP/existing-package-tag.json"
              node - "$RUNNER_TEMP/existing-package-tag.json" "$VERSION" "$TRACK" "$TAG" "$PINNED_SHA" <<'NODE'
          const fs=require("node:fs");
          const [file,version,track,tag,sourceCommit]=process.argv.slice(2);
          const marker=JSON.parse(fs.readFileSync(file,"utf8"));
          if(marker.schemaVersion!==1||marker.packageName!=="@kastrick/nextjs-engine"
            ||marker.version!==version||marker.track!==track||marker.tag!==tag
            ||marker.layout!=="npm-pack-root"||marker.sourceCommit!==sourceCommit
            ||typeof marker.migrationOnly!=="boolean") {
            throw new Error("Existing package tag does not match this release's exact source pin.");
          }
          NODE
              if git show "$EXISTING_COMMIT:.package-tag.json" | grep -Fq '"migrationOnly": true'; then
                PUSH_TAG=true
              else
                PACKAGE_SHA="$EXISTING_COMMIT"
              fi
            else
              git cat-file -e "$EXISTING_COMMIT:$TARGET/package.json" || {
                echo "Existing tag is neither a verified package-root tag nor a recognized legacy archive tag." >&2; exit 1;
              }
              git show "$EXISTING_COMMIT:$TARGET/package.json" > "$RUNNER_TEMP/legacy-tag-package.json"
              git show "$EXISTING_COMMIT:$TARGET/UPSTREAM.md" > "$RUNNER_TEMP/legacy-tag-upstream.md"
              node - "$RUNNER_TEMP/legacy-tag-package.json" "$VERSION" <<'NODE'
          const fs=require("node:fs");
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(p.name!=="@kastrick/nextjs-engine"||p.version!==process.argv[3]) {
            throw new Error("Legacy package tag points to a different package version.");
          }
          NODE
              grep -Fq -- "- Requested and resolved source commit: $PINNED_SHA" "$RUNNER_TEMP/legacy-tag-upstream.md" \
                || grep -Fq -- "- Resolved source commit: $PINNED_SHA" "$RUNNER_TEMP/legacy-tag-upstream.md" || {
                  echo "Legacy tag $TAG does not prove the requested source commit; refusing to retag." >&2; exit 1;
                }
              PUSH_TAG=true
            fi
          else
            PUSH_TAG=true
          fi

          if [[ "$PUSH_TAG" == "true" ]]; then
            git tag --force --annotate "$TAG" --message "@kastrick/nextjs-engine $VERSION package-root snapshot" "$NEW_PACKAGE_SHA"
            git push --force origin "refs/tags/$TAG"
            PACKAGE_SHA="$NEW_PACKAGE_SHA"
          fi

          if [[ "$TRACK" == "stable" ]]; then
            LATEST_STABLE="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const versions=[];
          function walk(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,e.name);if(e.isDirectory())walk(full);else if(e.name==="package.json"){const p=JSON.parse(fs.readFileSync(full,"utf8"));if(p.name==="@kastrick/nextjs-engine"&&/^\d+\.\d+\.\d+$/.test(p.version||""))versions.push(p.version);}}}
          walk("version");
          const nums=v=>v.split(".").map(Number);
          versions.sort((a,b)=>{const A=nums(a),B=nums(b);for(let i=0;i<3;i++)if(A[i]!==B[i])return A[i]-B[i];return 0;});
          if(!versions.length)throw new Error("No stable snapshot exists.");
          console.log(versions.at(-1));
          NODE
          )"
            if [[ "$VERSION" == "$LATEST_STABLE" ]]; then
              CURRENT_LATEST=""
              if git rev-parse -q --verify refs/tags/package.latest^{commit} >/dev/null; then
                CURRENT_LATEST="$(git rev-parse package.latest^{commit})"
              fi
              if [[ "$CURRENT_LATEST" != "$PACKAGE_SHA" ]]; then
                git tag --force --annotate package.latest --message "Latest stable @kastrick/nextjs-engine is $VERSION" "$PACKAGE_SHA"
                git push --force origin refs/tags/package.latest
              fi
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package_root_commit=$PACKAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "archive_commit=$ARCHIVE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Dispatch versioned prerelease GitHub Release builder
        if: ${{ inputs.track == 'alpha' || inputs.track == 'beta' }}
        env:
          TAG_NAME: ${{ steps.create-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(node - "$TAG_NAME" <<'NODE'
          const tagName = process.argv[2];
          if (!/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tagName)) {
            throw new Error("Refusing to dispatch an invalid prerelease tag: " + tagName);
          }
          process.stdout.write(JSON.stringify({
            event_type: "package-snapshot-published",
            client_payload: { tag_name: tagName }
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches" \
            --data "$PAYLOAD"
          echo "Dispatched GitHub prerelease builder for $TAG_NAME."

      - name: Select npm dist-tags
        id: dist-tag
        working-directory: archive
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          TRACK: ${{ steps.release-meta.outputs.track }}
        shell: bash
        run: |
          set -euo pipefail
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/current-dist-tags.json"
          export CURRENT_DIST_TAGS="$RUNNER_TEMP/current-dist-tags.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          import path from "node:path";
          const {VERSION,TRACK}=process.env;
          const registryTags=JSON.parse(fs.readFileSync(process.env.CURRENT_DIST_TAGS,"utf8"));
          const stable=[],alpha=[],beta=[];
          function walk(dir){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,e.name);
              if(e.isDirectory())walk(full);
              else if(e.name==="package.json"){
                const p=JSON.parse(fs.readFileSync(full,"utf8"));
                if(p.name!=="@kastrick/nextjs-engine")continue;
                if(/^\\d+\\.\\d+\\.\\d+$/.test(p.version||""))stable.push(p.version);
                else if(/^\\d+\\.\\d+\\.\\d+-alpha\\.\\d+$/.test(p.version||""))alpha.push(p.version);
                else if(/^\\d+\\.\\d+\\.\\d+-beta\\.\\d+$/.test(p.version||""))beta.push(p.version);
              }
            }
          }
          walk("version");walk("alpha/version");walk("beta/version");
          const compare=(a,b)=>{
            const aa=String(a||"").match(/^(\\d+)\\.(\\d+)\\.(\\d+)(?:-(alpha|beta)\\.(\\d+))?$/);
            const bb=String(b||"").match(/^(\\d+)\\.(\\d+)\\.(\\d+)(?:-(alpha|beta)\\.(\\d+))?$/);
            if(!aa)return -1;if(!bb)return 1;
            for(let i=1;i<=3;i++){const d=Number(aa[i])-Number(bb[i]);if(d)return d;}
            if(!aa[4]&&!bb[4])return 0;
            if(!aa[4])return 1;if(!bb[4])return -1;
            if(aa[4]!==bb[4])return aa[4]>bb[4]?1:-1;
            return Number(aa[5])-Number(bb[5]);
          };
          for(const list of [stable,alpha,beta])list.sort(compare);
          const list={stable,alpha,beta}[TRACK];
          if(!list||!list.includes(VERSION))throw new Error("The selected release is not present in the archive catalog.");
          const versionTag=TRACK==="stable"?"package."+VERSION:"package-"+TRACK+"."+VERSION;
          const proposedChannel=TRACK==="stable"?"latest":TRACK;
          const channelTag=list.at(-1)===VERSION&&compare(VERSION,registryTags[proposedChannel])>=0?proposedChannel:"";
          console.log("value="+versionTag);
          console.log("version_tag="+versionTag);
          console.log("channel_tag="+channelTag);
          NODE

      - name: Skip an already-published immutable npm version
        id: registry-version
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          REFRESHED: ${{ steps.prepare.outputs.refreshed }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            if [[ "$REFRESHED" == "true" ]]; then
              echo "::error::Version $VERSION appeared on npm after the refresh preflight. The workflow will not alter dist-tags or attempt a replacement publish."
              exit 1
            fi
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "@kastrick/nextjs-engine@$VERSION already exists; preserving the immutable version."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the pinned snapshot to npm
        if: steps.registry-version.outputs.should_publish == 'true'
        working-directory: archive/${{ steps.prepare.outputs.target }}
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
          # Use npm trusted-publishing OIDC instead of a legacy environment token.
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Apply and verify npm dist-tags
        working-directory: archive
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          TRACK: ${{ steps.release-meta.outputs.track }}
          VERSION_TAG: ${{ steps.dist-tag.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.dist-tag.outputs.channel_tag }}
          NODE_AUTH_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then
            npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"
          fi
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          node .github/scripts/verify-npm-dist-tags.mjs "$RUNNER_TEMP/npm-dist-tags.json" "$VERSION" "$TRACK" "$VERSION_TAG" "$CHANNEL_TAG" "$GITHUB_WORKSPACE/archive"

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          SOURCE_BRANCH: ${{ steps.release-meta.outputs.source_branch }}
          SNAPSHOT_ACTION: ${{ steps.release-meta.outputs.snapshot_action }}
          REFRESHED: ${{ steps.prepare.outputs.refreshed }}
          SOURCE_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          TARGET: ${{ steps.prepare.outputs.target }}
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
          CHANNEL_TAG: ${{ steps.dist-tag.outputs.channel_tag }}
          SHOULD_PUBLISH: ${{ steps.registry-version.outputs.should_publish }}
        run: |
          {
            echo "## @kastrick/nextjs-engine release pin"
            echo "- Version: $VERSION"
            echo "- Source: $SOURCE_BRANCH@$SOURCE_SHA"
            echo "- Version source: pinned commit package.json"
            echo "- Snapshot action: $SNAPSHOT_ACTION"
            echo "- Existing snapshot refreshed: $REFRESHED"
            echo "- Archive snapshot: $TARGET"
            echo "- Git tag: ${{ steps.create-tag.outputs.tag }}"
            echo "- npm dist-tag: $DIST_TAG"
            echo "- New npm publication required: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-archived-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'archive'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive
        uses: actions/checkout@v6
        with:
          ref: package/main
          fetch-depth: 0

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: |
            scripts/gen3-assert-green-commit.js
            .github/scripts/copy-content-includes.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false



      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0

      - name: Resolve and validate the existing snapshot
        id: snapshot
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          [[ -n "$VERSION" ]] || { echo "Archive mode requires an explicit version; source mode reads version from package.json." >&2; exit 1; }
          if [[ "$TRACK" == "stable" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Stable versions must look like 2.6.2." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SNAPSHOT="$VERSION"
            if [[ "$PATCH" == "0" ]]; then SNAPSHOT="$MAJOR.$MINOR"; fi
            DIR="version/$MAJOR.$MINOR/version/$SNAPSHOT"
            VERSION_TAG="package.$VERSION"
          elif [[ "$TRACK" == "alpha" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)$ ]] || { echo "Alpha versions must look like 3.0.0-alpha.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            DIR="alpha/version/$MAJOR.alpha/version/$VERSION"
            VERSION_TAG="package-alpha.$VERSION"
          elif [[ "$TRACK" == "beta" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]] || { echo "Beta versions must look like 3.0.0-beta.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            DIR="beta/version/$MAJOR.beta/version/$VERSION"
            VERSION_TAG="package-beta.$VERSION"
          else
            echo "track must be stable, alpha, or beta." >&2
            exit 1
          fi

          test -f "$DIR/package.json" || { echo "Snapshot not found: $DIR/package.json" >&2; exit 1; }
          test -f "$DIR/UPSTREAM.md" || { echo "Snapshot provenance file is missing: $DIR/UPSTREAM.md" >&2; exit 1; }
          test -f "$DIR/index.ts" && test -f "$DIR/tsconfig.json" && test -f "$DIR/engine/index.ts" || {
            echo "Snapshot is missing a required package entry file." >&2; exit 1;
          }

          # Stable archive snapshots are derived from named historical release tags.
          # Verify the recorded source tag and commit instead of trusting the folder name.
          if [[ "$TRACK" == "stable" ]]; then
            git fetch --force --tags origin
            SOURCE_INFO="$(node - "$DIR/UPSTREAM.md" <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync(process.argv[2], "utf8");
          const tag = text.match(/^- Source tag:\s*\x60?([^\x60\r\n]+)\x60?\s*$/m)?.[1];
          const sha = text.match(/^- Resolved source commit:\s*\x60?([0-9a-f]{40})\x60?\s*$/m)?.[1];
          if (!tag || !sha) throw new Error("Stable snapshot must record its original source tag and full commit SHA.");
          console.log(tag);
          console.log(sha);
          NODE
            )"
            SOURCE_TAG="$(printf '%s\n' "$SOURCE_INFO" | sed -n '1p')"
            SOURCE_SHA="$(printf '%s\n' "$SOURCE_INFO" | sed -n '2p')"
            [[ "$SOURCE_TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid source tag in UPSTREAM.md." >&2; exit 1; }
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA in UPSTREAM.md." >&2; exit 1; }
            TAG_SHA="$(git rev-parse -q --verify "refs/tags/$SOURCE_TAG^{commit}")" || {
              echo "Original source tag $SOURCE_TAG is missing from this repository." >&2; exit 1;
            }
            [[ "$TAG_SHA" == "$SOURCE_SHA" ]] || {
              echo "Source provenance mismatch: $SOURCE_TAG resolves to $TAG_SHA, but UPSTREAM.md records $SOURCE_SHA." >&2
              exit 1
            }
            echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
            echo "source_commit=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "Verified original source tag $SOURCE_TAG at $SOURCE_SHA."
          fi

          node - "$DIR" "$VERSION" "$TRACK" "$VERSION_TAG" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = require("node:path");
          const [dir, version, track, versionTag] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
          if (manifest.name !== "@kastrick/nextjs-engine" || manifest.version !== version) {
            throw new Error("Archive manifest mismatch: " + manifest.name + "@" + manifest.version);
          }
          if (manifest.private === true) throw new Error("Archived package is marked private.");
          for (const file of ["index.ts", "tsconfig.json", "UPSTREAM.md", "engine/index.ts"]) {
            if (!fs.existsSync(path.join(dir, file))) throw new Error("Missing required file: " + file);
          }
          const provenance = fs.readFileSync(path.join(dir, "UPSTREAM.md"), "utf8");
          const sourceBranch = provenance.match(/^- Source branch:\s*\`?([A-Za-z0-9._/-]+)\`?\s*$/m)?.[1] || "";
          const sourceCommit = provenance.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1] || "";
          if (["alpha", "beta"].includes(track) && (!/^main-[23]$/.test(sourceBranch) || !/^[0-9a-f]{40}$/.test(sourceCommit))) {
            throw new Error("Alpha/Beta snapshot provenance must include a supported source branch and full source commit SHA.");
          }
          console.log("directory=" + dir);
          console.log("version=" + version);
          console.log("track=" + track);
          console.log("version_tag=" + versionTag);
          console.log("source_branch=" + sourceBranch);
          console.log("source_commit=" + sourceCommit);
          NODE

      - name: Require green runtime and browser CI for prereleases
        if: ${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_BRANCH: ${{ steps.snapshot.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Type-check and inspect packed contents
        working-directory: ${{ steps.snapshot.outputs.directory }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check

      - name: Determine whether this release should advance a channel tag
        id: channel
        shell: bash
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
        run: |
          set -euo pipefail
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          node - "$VERSION" "$TRACK" "$RUNNER_TEMP/npm-dist-tags.json" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const [candidate, track, tagsPath] = process.argv.slice(2);
          const tags = JSON.parse(fs.readFileSync(tagsPath, "utf8"));

          function parse(v) {
            const m = String(v || "").match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
            if (!m) return null;
            return {
              core: m.slice(1, 4).map(Number),
              pre: m[4] ? m[4].split(".") : null
            };
          }
          function compare(aText, bText) {
            const a = parse(aText), b = parse(bText);
            if (!a) return -1;
            if (!b) return 1;
            for (let i = 0; i < 3; i++) {
              if (a.core[i] !== b.core[i]) return a.core[i] > b.core[i] ? 1 : -1;
            }
            if (a.pre === null && b.pre === null) return 0;
            if (a.pre === null) return 1;
            if (b.pre === null) return -1;
            const n = Math.max(a.pre.length, b.pre.length);
            for (let i = 0; i < n; i++) {
              if (i >= a.pre.length) return -1;
              if (i >= b.pre.length) return 1;
              if (a.pre[i] === b.pre[i]) continue;
              const an = /^\d+$/.test(a.pre[i]), bn = /^\d+$/.test(b.pre[i]);
              if (an && bn) return Number(a.pre[i]) > Number(b.pre[i]) ? 1 : -1;
              if (an !== bn) return an ? -1 : 1;
              return a.pre[i] > b.pre[i] ? 1 : -1;
            }
            return 0;
          }

          let channel = "";
          if (track === "stable") {
            if (compare(candidate, tags.latest) > 0) channel = "latest";
          } else if (track === "alpha" || track === "beta") {
            if (compare(candidate, tags[track]) > 0) channel = track;
          } else {
            throw new Error("Unsupported track: " + track);
          }
          console.log("channel_tag=" + channel);
          NODE

      - name: Skip an already-published immutable npm version
        id: registry-version
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "@kastrick/nextjs-engine@$VERSION already exists; preserving the immutable version."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the archived snapshot to npm
        if: steps.registry-version.outputs.should_publish == 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
        run: npm publish --access public --tag "$VERSION_TAG"

      - name: Apply npm dist-tags
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.channel.outputs.channel_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then
            npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"
          fi

      - name: Create or verify immutable prerelease tag
        if: ${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        env:
          TAG_NAME: ${{ steps.snapshot.outputs.version_tag }}
          VERSION: ${{ steps.snapshot.outputs.version }}
          DIRECTORY: ${{ steps.snapshot.outputs.directory }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}" >/dev/null; then
            git cat-file -e "$TAG_NAME:$DIRECTORY/package.json"
            git show "$TAG_NAME:$DIRECTORY/package.json" > "$RUNNER_TEMP/tag-package.json"
            git show "$TAG_NAME:$DIRECTORY/UPSTREAM.md" > "$RUNNER_TEMP/tag-upstream.md"
            node - "$RUNNER_TEMP/tag-package.json" "$VERSION" "$RUNNER_TEMP/tag-upstream.md" "$SOURCE_SHA" <<'NODE'
          const fs = require("node:fs");
          const [manifestPath, version, provenancePath, sourceSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const provenance = fs.readFileSync(provenancePath, "utf8");
          const commit = provenance.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1];
          if (manifest.name !== "@kastrick/nextjs-engine" || manifest.version !== version || commit !== sourceSha) {
            throw new Error("Existing prerelease tag does not match the archive snapshot provenance.");
          }
          NODE
          else
            git tag -a "$TAG_NAME" -m "@kastrick/nextjs-engine $VERSION from $SOURCE_SHA" HEAD
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Dispatch archived prerelease GitHub Release builder
        if: ${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        env:
          TAG_NAME: ${{ steps.snapshot.outputs.version_tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(node - "$TAG_NAME" <<'NODE'
          const tagName = process.argv[2];
          if (!/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tagName)) {
            throw new Error("Refusing to dispatch an invalid prerelease tag: " + tagName);
          }
          process.stdout.write(JSON.stringify({
            event_type: "package-snapshot-published",
            client_payload: { tag_name: tagName }
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches" \
            --data "$PAYLOAD"
          echo "Dispatched GitHub prerelease builder for $TAG_NAME."

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          DIRECTORY: ${{ steps.snapshot.outputs.directory }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.channel.outputs.channel_tag }}
          SHOULD_PUBLISH: ${{ steps.registry-version.outputs.should_publish }}
        run: |
          {
            echo "## @kastrick/nextjs-engine archived release"
            echo "- Version: $VERSION"
            echo "- Track: $TRACK"
            echo "- Archive snapshot: $DIRECTORY"
            echo "- npm version dist-tag: $VERSION_TAG"
            echo "- Channel alias advanced: ${CHANNEL_TAG:-none}"
            echo "- New npm publication required: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"


  publish-tagged-snapshot:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/package')) || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive and version history
        uses: actions/checkout@v6
        with:
          ref: package/main
          fetch-depth: 0

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: |
            scripts/gen3-assert-green-commit.js
            .github/scripts/copy-content-includes.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing and dist-tags
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0

      - name: Verify package-root tag and resolve selected snapshot
        id: snapshot
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag_name || '' }}
        run: |
          set -euo pipefail
          TAG_NAME="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG_NAME" =~ ^package(-alpha|-beta)?\.[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+)?$ ]] || {
            echo "Invalid package release tag: $TAG_NAME" >&2; exit 1;
          }
          git fetch --force --tags origin
          git fetch origin refs/heads/package/main:refs/remotes/origin/package/main
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}")" || {
            echo "Release tag is missing: $TAG_NAME" >&2; exit 1;
          }
          for file in package.json index.ts engine/index.ts .package-tag.json; do
            git cat-file -e "$TAG_COMMIT:$file" || {
              echo "Version tag is not a package-root snapshot; missing $file." >&2; exit 1;
            }
          done
          git archive "$TAG_COMMIT" | tar -x -C "$RUNNER_TEMP" --transform='s,^,ne-tag-package/,'
          PACKAGE_DIR="$RUNNER_TEMP/ne-tag-package"
          test -f "$PACKAGE_DIR/package.json"
          test -f "$PACKAGE_DIR/.package-tag.json"
          test -f "$PACKAGE_DIR/index.ts"
          test -f "$PACKAGE_DIR/engine/index.ts"
          node - "$TAG_NAME" "$TAG_COMMIT" "$PACKAGE_DIR" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const [tag,tagCommit,dir,output]=process.argv.slice(2);
          const marker=JSON.parse(fs.readFileSync(path.join(dir,".package-tag.json"),"utf8"));
          const pkg=JSON.parse(fs.readFileSync(path.join(dir,"package.json"),"utf8"));
          const match=tag.match(/^package\.(\d+\.\d+\.\d+)$/)
            ||tag.match(/^package-alpha\.(\d+\.\d+\.\d+-alpha\.\d+)$/)
            ||tag.match(/^package-beta\.(\d+\.\d+\.\d+-beta\.\d+)$/);
          if(!match) throw new Error("Unsupported version tag: "+tag);
          const version=match[1];
          const track=tag.startsWith("package-alpha.")?"alpha":tag.startsWith("package-beta.")?"beta":"stable";
          const parts=version.match(/^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)\.\d+)?$/);
          if(!parts) throw new Error("Invalid package version: "+version);
          const [,major,minor,patch,pre]=parts;
          const folder=track==="stable"&&!pre
            ? "version/"+major+"."+minor+"/version/"+(Number(patch)===0?major+"."+minor:version)
            : track+"/version/"+major+"."+track+"/version/"+version;
          if(marker.schemaVersion!==1||marker.packageName!=="@kastrick/nextjs-engine"
            ||marker.version!==version||marker.track!==track||marker.tag!==tag
            ||marker.layout!=="npm-pack-root"||marker.packagePath!==folder
            ||!/^([0-9a-f]{40})$/.test(marker.archiveCommit||"")
            ||!(marker.sourceCommit===null||/^[0-9a-f]{40}$/.test(marker.sourceCommit||""))
            ||typeof marker.migrationOnly!=="boolean"
            ||!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(marker.npmIntegrity||"")) {
            throw new Error("Git tag does not have a verified package-root marker.");
          }
          if(pkg.name!=="@kastrick/nextjs-engine"||pkg.version!==version||pkg.private===true) {
            throw new Error("Package manifest does not match "+tag+".");
          }
          if(fs.readFileSync(path.join(dir,"index.ts"),"utf8").trim()!=='export * from "./engine";') {
            throw new Error("Package root index.ts must re-export ./engine.");
          }
          const archiveCommit=marker.archiveCommit;
          const metaFile=path.join(process.env.RUNNER_TEMP||path.dirname(dir),"tag-provenance.json");
          let sourceBranch="", sourceCommit="";
          try {
            const {execFileSync}=require("node:child_process");
            const text=execFileSync("git",["show",archiveCommit+":"+folder+"/UPSTREAM.md"],{encoding:"utf8"});
            sourceBranch=text.match(/^- Source branch:\s*\`?([A-Za-z0-9._/-]+)\`?\s*$/m)?.[1]||"";
            sourceCommit=text.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1]||"";
          } catch {}
          if(marker.sourceCommit && sourceCommit && marker.sourceCommit!==sourceCommit) {
            throw new Error("Package marker source SHA does not match its archived provenance.");
          }
          if(["alpha","beta"].includes(track)&&marker.migrationOnly!==true
            &&(!/^main-[23]$/.test(sourceBranch)||!sourceCommit||sourceCommit!==marker.sourceCommit)) {
            throw new Error("Prerelease tag is missing exact source branch/SHA provenance.");
          }
          fs.writeFileSync(metaFile,JSON.stringify({sourceBranch,sourceCommit,archiveCommit,folder,tagCommit}));
          const lines=[
            "version="+version,
            "track="+track,
            "directory="+dir,
            "version_tag="+tag,
            "source_branch="+sourceBranch,
            "source_commit="+(marker.sourceCommit||sourceCommit),
            "archive_commit="+archiveCommit,
            "migration_only="+(marker.migrationOnly===true),
          ];
          fs.appendFileSync(output,lines.join("\n")+"\n");
          NODE
          ARCHIVE_COMMIT="$(sed -n 's/^archive_commit=//p' "$GITHUB_OUTPUT" | tail -n1)"
          test "$(git rev-parse "$TAG_COMMIT^")" = "$ARCHIVE_COMMIT" || {
            echo "Package-root tag does not retain its archive commit as its parent." >&2; exit 1;
          }
          git merge-base --is-ancestor "$ARCHIVE_COMMIT" refs/remotes/origin/package/main || {
            echo "Package-root tag provenance is not reachable from package/main." >&2; exit 1;
          }
          MIGRATION_ONLY="$(sed -n 's/^migration_only=//p' "$GITHUB_OUTPUT" | tail -n1)"
          TRACK="$(sed -n 's/^track=//p' "$GITHUB_OUTPUT" | tail -n1)"
          VERSION="$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n1)"
          if [[ "$MIGRATION_ONLY" != "true" && "$TRACK" == "stable" ]]; then
            npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/current-dist-tags.json"
            export VERSION TRACK CURRENT_DIST_TAGS="$RUNNER_TEMP/current-dist-tags.json"
            node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
            import fs from "node:fs";
            import path from "node:path";
            const {VERSION,TRACK,CURRENT_DIST_TAGS}=process.env;
            const tags=JSON.parse(fs.readFileSync(CURRENT_DIST_TAGS,"utf8"));
            const cmp=(a,b)=>{
              const aa=(a||"0.0.0").split(/[-.]/).map(x=>/^\d+$/.test(x)?Number(x):x);
              const bb=(b||"0.0.0").split(/[-.]/).map(x=>/^\d+$/.test(x)?Number(x):x);
              for(let i=0;i<Math.max(aa.length,bb.length);i++){
                if(aa[i]===undefined)return -1;
                if(bb[i]===undefined)return 1;
                if(aa[i]===bb[i])continue;
                if(typeof aa[i]==="number"&&typeof bb[i]==="number")return aa[i]-bb[i];
                return String(aa[i]).localeCompare(String(bb[i]));
              }
              return 0;
            };
            const stable=[];
            function walk(dir){
              if(!fs.existsSync(dir))return;
              for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
                const full=path.join(dir,entry.name);
                if(entry.isDirectory())walk(full);
                else if(entry.name==="package.json"){
                  const p=JSON.parse(fs.readFileSync(full,"utf8"));
                  if(p.name==="@kastrick/nextjs-engine"&&/^\d+\.\d+\.\d+$/.test(p.version||""))stable.push(p.version);
                }
              }
            }
            walk("version");
            stable.sort(cmp);
            const newestStable=stable.at(-1)||"";
            const channelTag=TRACK==="stable"&&newestStable===VERSION&&cmp(VERSION,tags.latest)>0?"latest":"";
            console.log("channel_tag="+channelTag);
            NODE
          else
            echo "channel_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Require green runtime and browser CI for prereleases
        if: ${{ steps.snapshot.outputs.migration_only != 'true' && (steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta') }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_BRANCH: ${{ steps.snapshot.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Validate and pack the selected package-root snapshot
        if: steps.snapshot.outputs.migration_only != 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check

      - name: Publish Alpha/Beta snapshot as a GitHub Release (never to npm)
        if: ${{ steps.snapshot.outputs.migration_only != 'true' && (steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta') }}
        id: github-prerelease
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          TAG_NAME: ${{ steps.snapshot.outputs.version_tag }}
          SOURCE_BRANCH: ${{ steps.snapshot.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ne-release"
          mkdir -p "$OUT"
          npm pack --ignore-scripts --pack-destination "$OUT" --json > "$OUT/pack.json"
          PACKED="$(node - "$OUT/pack.json" <<'NODE'
          const fs=require("node:fs");
          const result=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(!Array.isArray(result)||!result[0]||typeof result[0].filename!=="string")throw new Error("npm pack did not produce a package filename.");
          process.stdout.write(result[0].filename);
          NODE
          )"
          TARBALL="$OUT/nextjs-engine-$VERSION.tgz"
          mv "$OUT/$PACKED" "$TARBALL"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          node - "$VERSION" "$TRACK" "$TAG_NAME" "$SHA256" "$TARBALL" "$SOURCE_BRANCH" "$SOURCE_SHA" "$OUT/ne-release.json" <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const [version,track,tag,sha256,tarball,sourceBranch,sourceCommit,output]=process.argv.slice(2);
          const manifest={schemaVersion:1,packageName:"@kastrick/nextjs-engine",version,track,tag,sourceBranch,sourceCommit,sha256,assetName:path.basename(tarball),floating:false,
            summary:"Validated "+track+" release pinned to "+sourceBranch+"@"+sourceCommit+"."};
          fs.writeFileSync(output,JSON.stringify(manifest,null,2)+"\n");
          NODE
          TRACK_UPPER="$(printf '%s' "$TRACK" | tr '[:lower:]' '[:upper:]')"
          NOTES="$OUT/release-notes.md"
          {
            echo "## Nextjs Engine $VERSION"
            echo
            echo "- Channel: **$TRACK_UPPER**"
            echo "- Artifact SHA-256: \`$SHA256\`"
            echo
            echo "<!-- NE-CHANNEL-MANIFEST-START -->"
            cat "$OUT/ne-release.json"
            echo "<!-- NE-CHANNEL-MANIFEST-END -->"
          } > "$NOTES"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            EXISTING="$OUT/existing"
            mkdir -p "$EXISTING"
            gh release download "$TAG_NAME" --pattern ne-release.json --dir "$EXISTING" || {
              echo "Release tag exists without a channel manifest; refusing to mutate it." >&2; exit 1;
            }
            node - "$EXISTING/ne-release.json" "$OUT/ne-release.json" <<'NODE'
          const fs=require("node:fs");
          const [existingPath,candidatePath]=process.argv.slice(2);
          const existing=JSON.parse(fs.readFileSync(existingPath,"utf8"));
          const candidate=JSON.parse(fs.readFileSync(candidatePath,"utf8"));
          for(const key of ["packageName","version","track","tag","sourceCommit","sha256","assetName"]) {
            if(existing[key]!==candidate[key]) throw new Error("GitHub release "+candidate.tag+" is immutable; existing "+key+" differs.");
          }
          NODE
            if ! gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -Fxq "nextjs-engine-$VERSION.tgz"; then
              echo "GitHub Release manifest exists but package tarball is missing." >&2; exit 1;
            fi
          else
            gh release create "$TAG_NAME" "$TARBALL" "$OUT/ne-release.json" --title "Nextjs Engine $VERSION ($TRACK_UPPER)" --notes-file "$NOTES" --prerelease
          fi

      - name: Skip an already-published immutable npm version
        if: steps.snapshot.outputs.migration_only != 'true' && steps.snapshot.outputs.track == 'stable'
        id: registry-version
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm; preserving immutable version."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the selected Stable package to npm
        if: steps.snapshot.outputs.migration_only != 'true' && steps.snapshot.outputs.track == 'stable' && steps.registry-version.outputs.should_publish == 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          DIST_TAG: ${{ steps.snapshot.outputs.version_tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Apply and verify stable npm dist-tags
        if: steps.snapshot.outputs.migration_only != 'true' && steps.snapshot.outputs.track == 'stable'
        working-directory: archive
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.snapshot.outputs.channel_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"; fi
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          node .github/scripts/verify-npm-dist-tags.mjs "$RUNNER_TEMP/npm-dist-tags.json" "$VERSION" "$TRACK" "$VERSION_TAG" "$CHANNEL_TAG" .

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          CHANNEL_TAG: ${{ steps.snapshot.outputs.channel_tag }}
          MIGRATION_ONLY: ${{ steps.snapshot.outputs.migration_only }}
          SHOULD_PUBLISH: ${{ steps.registry-version.outputs.should_publish }}
        run: |
          {
            echo "## @kastrick/nextjs-engine package-root tag"
            echo "- Version: $VERSION"
            echo "- Track: $TRACK"
            echo "- Package root: ${{ steps.snapshot.outputs.directory }}"
            echo "- Migration-only: $MIGRATION_ONLY"
            echo "- Channel alias advanced: ${CHANNEL_TAG:-none}"
            echo "- New npm publication required: ${SHOULD_PUBLISH:-no}"
          } >> "$GITHUB_STEP_SUMMARY"
