name: Publish versioned package

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Publish an existing archived snapshot, or create a snapshot from a pinned source commit"
        required: true
        type: choice
        options: [source, archive]
        default: source
      source_branch:
        description: "Development branch containing the pinned source commit (source mode only)"
        required: false
        type: choice
        options: [main-2, main-3]
        default: main-3
      source_commit:
        description: "Exact 40-character commit SHA to package, not a moving branch name (source mode only)"
        required: false
        type: string
      version:
        description: "Source mode reads the version from the pinned package.json; archive mode requires this value"
        required: false
        type: string
      track:
        description: "Stable or alpha release"
        required: true
        type: choice
        options: [stable, alpha, beta]
  push:
    tags:
      - "package.[0-9]*"
      - "package-alpha.[0-9]*"
      - "package-beta.[0-9]*"
  repository_dispatch:
    types: [package-snapshot-published]

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-from-source:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'source'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive branch
        uses: actions/checkout@v6
        with:
          ref: package/main
          path: archive
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact pinned source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: scripts/gen3-assert-green-commit.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false



      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0

      - name: Validate source pin and prepare immutable snapshot
        id: prepare
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INPUT_VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          VERSION="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("source/package.json","utf8")); if(typeof p.version!=="string"||!p.version) process.exit(1); process.stdout.write(p.version)')"
          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$VERSION" ]]; then
            echo "Requested version $INPUT_VERSION does not match the pinned source package.json version $VERSION." >&2
            exit 1
          fi
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source_commit must be a lowercase 40-character SHA." >&2; exit 1; }
          PINNED_SHA="$(git -C source rev-parse HEAD)"
          [[ "$PINNED_SHA" == "$SOURCE_COMMIT" ]] || { echo "Checked-out commit does not match requested pin." >&2; exit 1; }

          git -C archive fetch --no-tags origin "$SOURCE_BRANCH"
          git -C archive merge-base --is-ancestor "$PINNED_SHA" FETCH_HEAD || {
            echo "Pinned commit is not reachable from $SOURCE_BRANCH." >&2
            exit 1
          }
          git -C archive fetch --no-tags origin refs/heads/package/main:refs/remotes/origin/package/main
          git -C archive switch --force-create package/main origin/package/main

          if [[ "$TRACK" == "alpha" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)$ ]] || { echo "Alpha versions must look like 3.0.0-alpha.2." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            FAMILY="$MAJOR.alpha"
            TARGET="alpha/version/$FAMILY/version/$VERSION"
            FAMILY_DIR="archive/alpha/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            else
              TEMPLATE_DIR="archive/alpha/version/3.alpha/version/3.0.0-alpha.1"
            fi
          elif [[ "$TRACK" == "beta" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]] || { echo "Beta versions must look like 3.0.0-beta.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            FAMILY="$MAJOR.beta"
            TARGET="beta/version/$FAMILY/version/$VERSION"
            FAMILY_DIR="archive/beta/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            else
              TEMPLATE_DIR="archive/alpha/version/3.alpha/version/3.0.0-alpha.1"
            fi
          elif [[ "$TRACK" == "stable" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Stable versions must look like 2.6.3." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            FAMILY="$MAJOR.$MINOR"
            SNAPSHOT="$VERSION"
            if [[ "$PATCH" == "0" ]]; then SNAPSHOT="$FAMILY"; fi
            TARGET="version/$FAMILY/version/$SNAPSHOT"
            FAMILY_DIR="archive/version/$FAMILY/version"
            if [[ -d "$FAMILY_DIR" ]]; then
              TEMPLATE_DIR="$(find "$FAMILY_DIR" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            elif [[ "$MAJOR" == "1" ]]; then
              TEMPLATE_DIR="archive/version/1.0/version/1.0"
            else
              TEMPLATE_DIR="archive/version/2.6/version/2.6.2"
            fi
          else
            echo "track must be stable, alpha, or beta." >&2
            exit 1
          fi

          [[ -f "$TEMPLATE_DIR/package.json" && -f "$TEMPLATE_DIR/tsconfig.json" ]] || { echo "Manifest template missing at $TEMPLATE_DIR." >&2; exit 1; }
          REUSE_EXISTING=false
          if [[ -e "archive/$TARGET" ]]; then
            [[ -f "archive/$TARGET/UPSTREAM.md" ]] || { echo "Snapshot exists without provenance; refusing to overwrite." >&2; exit 1; }
            grep -Fq -- "- Requested and resolved source commit: $PINNED_SHA" "archive/$TARGET/UPSTREAM.md" || {
              echo "Snapshot already exists with different or unknown provenance; refusing to overwrite." >&2
              exit 1
            }
            REUSE_EXISTING=true
          else
            if [[ -d source/src/engine ]]; then ENGINE_DIR="source/src/engine"
            elif [[ -d source/engine ]]; then ENGINE_DIR="source/engine"
            else echo "Pinned source has neither src/engine/ nor engine/; refusing to guess." >&2; exit 1
            fi
            DEST="archive/$TARGET"
            if [[ "$TRACK" == "alpha" || "$VERSION" =~ ^2\.7\.[0-9]+$ ]]; then
              test -f "source/bin/ne.js" || { echo "This release requires the NE CLI, but source/bin/ne.js is missing." >&2; exit 1; }
            fi
            mkdir -p "$DEST/engine"
            if [[ -d source/bin ]]; then
              mkdir -p "$DEST/bin"
              cp -a source/bin/. "$DEST/bin/"
            fi
            cp "$TEMPLATE_DIR/package.json" "$DEST/package.json"
            cp "$TEMPLATE_DIR/tsconfig.json" "$DEST/tsconfig.json"
            for file in README.md DOCUMENT.md; do
              if [[ -f "$TEMPLATE_DIR/$file" ]]; then cp "$TEMPLATE_DIR/$file" "$DEST/$file"; fi
              if [[ -f "source/$file" ]]; then cp "source/$file" "$DEST/$file"; fi
            done
            if [[ -d "$TEMPLATE_DIR/docs" ]]; then
              mkdir -p "$DEST/docs"
              cp -a "$TEMPLATE_DIR/docs/." "$DEST/docs/"
            fi
            if [[ -d source/docs ]]; then
              rm -rf "$DEST/docs"
              cp -a source/docs "$DEST/docs"
            fi
            cp -a "$ENGINE_DIR/." "$DEST/engine/"
            printf '%s\n' 'export * from "./engine";' > "$DEST/index.ts"
            export TARGET VERSION TRACK PINNED_SHA SOURCE_BRANCH ENGINE_DIR TEMPLATE_DIR
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const {TARGET,VERSION,TRACK,PINNED_SHA,SOURCE_BRANCH,ENGINE_DIR,TEMPLATE_DIR}=process.env;
          const root="archive/"+TARGET;
          const manifest=JSON.parse(fs.readFileSync(root+"/package.json","utf8"));
          manifest.name="@kastrick/nextjs-engine";
          manifest.version=VERSION;
          manifest.private=false;
          manifest.files=(manifest.files||[]).filter(p=>fs.existsSync(root+"/"+p));
          if(fs.existsSync(root+"/bin/ne.js")){
            manifest.bin={...(manifest.bin||{}),ne:"./bin/ne.js"};
            if(!manifest.files.includes("bin")) manifest.files.push("bin");
          }
          for(const [name,value] of Object.entries(manifest.exports||{})){
            if(name===".") continue;
            const targets=typeof value==="string"?[value]:[value.types,value.import,value.require,value.default].filter(Boolean);
            if(targets.some(p=>!fs.existsSync(root+"/"+p.replace(/^\.\//,"")))) delete manifest.exports[name];
          }
          fs.writeFileSync(root+"/package.json",JSON.stringify(manifest,null,"\t")+"\n");
          const provenance=[
            "# Snapshot provenance",
            "",
            "- Full package version: "+VERSION,
            "- Package: @kastrick/nextjs-engine",
            "- Archive track: "+TRACK,
            "- Source branch: "+SOURCE_BRANCH,
            "- Requested and resolved source commit: "+PINNED_SHA,
            "- Engine source path: "+ENGINE_DIR,
            "- Manifest/docs template: "+TEMPLATE_DIR,
            "",
            "The engine source was copied from the exact pinned commit above. The manifest name and version were normalized for the Kastrick npm package. Missing optional export targets were removed. This is an immutable source snapshot, not a live link.",
            ""
          ].join("\n");
          fs.writeFileSync(root+"/UPSTREAM.md",provenance);
          NODE
          fi

          node - "$TARGET" "$VERSION" <<'NODE'
          const fs=require("node:fs");
          const path=require("node:path");
          const target=process.argv[2], version=process.argv[3];
          const p=JSON.parse(fs.readFileSync(path.join("archive",target,"package.json"),"utf8"));
          if(p.name!=="@kastrick/nextjs-engine"||p.version!==version) throw new Error("Manifest name/version mismatch: "+p.name+"@"+p.version);
          for(const f of ["index.ts","engine/index.ts","tsconfig.json"]) if(!fs.existsSync(path.join("archive",target,f))) throw new Error("Missing "+f);
          const expected=(version.includes("-alpha.")||version.includes("-beta."))?version:(version.endsWith(".0")?version.split(".").slice(0,2).join("."):version);
          if(path.basename(target)!==expected) throw new Error("Snapshot path does not match "+version);
          NODE
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "pinned_sha=$PINNED_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "reuse_existing=$REUSE_EXISTING" >> "$GITHUB_OUTPUT"

      - name: Require green runtime and browser CI for prereleases
        if: ${{ inputs.track == 'alpha' || inputs.track == 'beta' }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Type-check and inspect packed contents
        working-directory: archive/${{ steps.prepare.outputs.target }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check
          rm -rf node_modules

      - name: Commit the snapshot to package/main
        working-directory: archive
        env:
          TARGET: ${{ steps.prepare.outputs.target }}
          VERSION: ${{ steps.prepare.outputs.version }}
          PINNED_SHA: ${{ steps.prepare.outputs.pinned_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "Release @kastrick/nextjs-engine $VERSION from $PINNED_SHA"
            git push origin HEAD:refs/heads/package/main
          fi

      - name: Create and push the version tag
        id: create-tag
        working-directory: archive
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TRACK: ${{ inputs.track }}
          PINNED_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          TARGET: ${{ steps.prepare.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TRACK" in
            stable) TAG="package.$VERSION" ;;
            alpha) TAG="package-alpha.$VERSION" ;;
            beta) TAG="package-beta.$VERSION" ;;
            *) echo "Unsupported track: $TRACK" >&2; exit 1 ;;
          esac
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git cat-file -e "$TAG:$TARGET/package.json"
            git show "$TAG:$TARGET/package.json" > "$RUNNER_TEMP/tag-package.json"
            git show "$TAG:$TARGET/UPSTREAM.md" > "$RUNNER_TEMP/tag-upstream.md"
            node - "$RUNNER_TEMP/tag-package.json" "$VERSION" <<'NODE'
          const fs=require("node:fs");
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(p.name!=="@kastrick/nextjs-engine"||p.version!==process.argv[3]) throw new Error("Existing tag points to a different package version.");
          NODE
            grep -Fq -- "- Requested and resolved source commit: $PINNED_SHA" "$RUNNER_TEMP/tag-upstream.md" || {
              echo "Tag $TAG exists but does not match source pin $PINNED_SHA." >&2; exit 1;
            }
            git merge-base --is-ancestor "$TAG^{commit}" refs/remotes/origin/package/main || {
              echo "Tag $TAG exists but is not reachable from package/main." >&2; exit 1;
            }
          else
            git tag -a "$TAG" -m "@kastrick/nextjs-engine $VERSION from $PINNED_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if [[ "$TRACK" == "stable" ]]; then
            LATEST_STABLE="$(node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const versions=[];
          function walk(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,e.name);if(e.isDirectory())walk(full);else if(e.name==="package.json"){const p=JSON.parse(fs.readFileSync(full,"utf8"));if(p.name==="@kastrick/nextjs-engine"&&/^\d+\.\d+\.\d+$/.test(p.version||""))versions.push(p.version);}}}
          walk("version");
          const nums=v=>v.split(".").map(Number);
          versions.sort((a,b)=>{const A=nums(a),B=nums(b);for(let i=0;i<3;i++)if(A[i]!==B[i])return A[i]-B[i];return 0;});
          if(!versions.length)throw new Error("No stable snapshot exists.");
          console.log(versions.at(-1));
          NODE
          )"
            if [[ "$VERSION" == "$LATEST_STABLE" ]]; then
              git tag -f -a package.latest -m "Latest stable @kastrick/nextjs-engine is $VERSION" "$TAG^{commit}"
              git push --force origin refs/tags/package.latest
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch versioned prerelease GitHub Release builder
        if: ${{ inputs.track == 'alpha' || inputs.track == 'beta' }}
        env:
          TAG_NAME: ${{ steps.create-tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(node - "$TAG_NAME" <<'NODE'
          const tagName = process.argv[2];
          if (!/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tagName)) {
            throw new Error("Refusing to dispatch an invalid prerelease tag: " + tagName);
          }
          process.stdout.write(JSON.stringify({
            event_type: "package-snapshot-published",
            client_payload: { tag_name: tagName }
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches" \
            --data "$PAYLOAD"
          echo "Dispatched GitHub prerelease builder for $TAG_NAME."

      - name: Select npm dist-tags
        id: dist-tag
        working-directory: archive
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TRACK: ${{ inputs.track }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          import path from "node:path";
          const stable=[], alpha=[], beta=[];
          function walk(dir){
            if(!fs.existsSync(dir)) return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,e.name);
              if(e.isDirectory()) walk(full);
              else if(e.name==="package.json"){
                const p=JSON.parse(fs.readFileSync(full,"utf8"));
                if(p.name!=="@kastrick/nextjs-engine") continue;
                if(/^\d+\.\d+\.\d+$/.test(p.version||"")) stable.push(p.version);
                else if(/^\d+\.\d+\.\d+-alpha\.\d+$/.test(p.version||"")) alpha.push(p.version);
                else if(/^\d+\.\d+\.\d+-beta\.\d+$/.test(p.version||"")) beta.push(p.version);
              }
            }
          }
          walk("version"); walk("alpha"); walk("beta");
          const sortNums=(list, prerelease)=>list.sort((a,b)=>{
            const rx=prerelease?new RegExp("^([0-9]+)\\.([0-9]+)\\.([0-9]+)-"+prerelease+"\\.([0-9]+)$"):null;
            const A=rx?a.match(rx).slice(1).map(Number):a.split(".").map(Number);
            const B=rx?b.match(rx).slice(1).map(Number):b.split(".").map(Number);
            for(let i=0;i<A.length;i++)if(A[i]!==B[i])return A[i]-B[i];
            return 0;
          });
          sortNums(stable,null); sortNums(alpha,"alpha"); sortNums(beta,"beta");
          const byTrack={stable,alpha,beta};
          const list=byTrack[process.env.TRACK];
          if(!list||!list.length)throw new Error("No "+process.env.TRACK+" snapshots found.");
          const newest=list.at(-1);
          const versionTag=process.env.TRACK==="stable"?"package."+process.env.VERSION:
            process.env.TRACK==="alpha"?"package-alpha."+process.env.VERSION:"package-beta."+process.env.VERSION;
          const channelTag=newest===process.env.VERSION?(process.env.TRACK==="stable"?"latest":process.env.TRACK):"";
          console.log("value="+versionTag);
          console.log("version_tag="+versionTag);
          console.log("channel_tag="+channelTag);
          NODE
      - name: Skip an already-published immutable npm version
        id: registry-version
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "@kastrick/nextjs-engine@$VERSION already exists; preserving the immutable version."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the pinned snapshot to npm
        if: steps.registry-version.outputs.should_publish == 'true'
        working-directory: archive/${{ steps.prepare.outputs.target }}
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Apply npm dist-tags
        working-directory: archive
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          VERSION_TAG: ${{ steps.dist-tag.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.dist-tag.outputs.channel_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then
            npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"
          fi

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ steps.prepare.outputs.pinned_sha }}
          TARGET: ${{ steps.prepare.outputs.target }}
          DIST_TAG: ${{ steps.dist-tag.outputs.value }}
          CHANNEL_TAG: ${{ steps.dist-tag.outputs.channel_tag }}
          SHOULD_PUBLISH: ${{ steps.registry-version.outputs.should_publish }}
        run: |
          {
            echo "## @kastrick/nextjs-engine release pin"
            echo "- Version: $VERSION"
            echo "- Source: $SOURCE_BRANCH@$SOURCE_SHA"
            echo "- Archive snapshot: $TARGET"
            echo "- Git tag: ${{ steps.create-tag.outputs.tag }}"
            echo "- npm dist-tag: $DIST_TAG"
            echo "- New npm publication required: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-archived-snapshot:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'archive'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive
        uses: actions/checkout@v6
        with:
          ref: package/main
          fetch-depth: 0

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: scripts/gen3-assert-green-commit.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false



      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0

      - name: Resolve and validate the existing snapshot
        id: snapshot
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          if [[ "$TRACK" == "stable" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Stable versions must look like 2.6.2." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SNAPSHOT="$VERSION"
            if [[ "$PATCH" == "0" ]]; then SNAPSHOT="$MAJOR.$MINOR"; fi
            DIR="version/$MAJOR.$MINOR/version/$SNAPSHOT"
            VERSION_TAG="package.$VERSION"
          elif [[ "$TRACK" == "alpha" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)$ ]] || { echo "Alpha versions must look like 3.0.0-alpha.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            DIR="alpha/version/$MAJOR.alpha/version/$VERSION"
            VERSION_TAG="package-alpha.$VERSION"
          elif [[ "$TRACK" == "beta" ]]; then
            [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)$ ]] || { echo "Beta versions must look like 3.0.0-beta.1." >&2; exit 1; }
            MAJOR="${BASH_REMATCH[1]}"
            DIR="beta/version/$MAJOR.beta/version/$VERSION"
            VERSION_TAG="package-beta.$VERSION"
          else
            echo "track must be stable, alpha, or beta." >&2
            exit 1
          fi

          test -f "$DIR/package.json" || { echo "Snapshot not found: $DIR/package.json" >&2; exit 1; }
          test -f "$DIR/UPSTREAM.md" || { echo "Snapshot provenance file is missing: $DIR/UPSTREAM.md" >&2; exit 1; }
          test -f "$DIR/index.ts" && test -f "$DIR/tsconfig.json" && test -f "$DIR/engine/index.ts" || {
            echo "Snapshot is missing a required package entry file." >&2; exit 1;
          }

          # Stable archive snapshots are derived from named historical release tags.
          # Verify the recorded source tag and commit instead of trusting the folder name.
          if [[ "$TRACK" == "stable" ]]; then
            git fetch --force --tags origin
            SOURCE_INFO="$(node - "$DIR/UPSTREAM.md" <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync(process.argv[2], "utf8");
          const tag = text.match(/^- Source tag:\s*\x60?([^\x60\r\n]+)\x60?\s*$/m)?.[1];
          const sha = text.match(/^- Resolved source commit:\s*\x60?([0-9a-f]{40})\x60?\s*$/m)?.[1];
          if (!tag || !sha) throw new Error("Stable snapshot must record its original source tag and full commit SHA.");
          console.log(tag);
          console.log(sha);
          NODE
            )"
            SOURCE_TAG="$(printf '%s\n' "$SOURCE_INFO" | sed -n '1p')"
            SOURCE_SHA="$(printf '%s\n' "$SOURCE_INFO" | sed -n '2p')"
            [[ "$SOURCE_TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid source tag in UPSTREAM.md." >&2; exit 1; }
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA in UPSTREAM.md." >&2; exit 1; }
            TAG_SHA="$(git rev-parse -q --verify "refs/tags/$SOURCE_TAG^{commit}")" || {
