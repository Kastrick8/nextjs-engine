        env:
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
        run: npm publish --access public --tag "$VERSION_TAG"

      - name: Apply npm dist-tags
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.channel.outputs.channel_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then
            npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"
          fi

      - name: Create or verify immutable prerelease tag
        if: \${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        env:
          TAG_NAME: \${{ steps.snapshot.outputs.version_tag }}
          VERSION: \${{ steps.snapshot.outputs.version }}
          DIRECTORY: \${{ steps.snapshot.outputs.directory }}
          SOURCE_SHA: \${{ steps.snapshot.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}" >/dev/null; then
            git cat-file -e "$TAG_NAME:$DIRECTORY/package.json"
            git show "$TAG_NAME:$DIRECTORY/package.json" > "$RUNNER_TEMP/tag-package.json"
            git show "$TAG_NAME:$DIRECTORY/UPSTREAM.md" > "$RUNNER_TEMP/tag-upstream.md"
            node - "$RUNNER_TEMP/tag-package.json" "$VERSION" "$RUNNER_TEMP/tag-upstream.md" "$SOURCE_SHA" <<'NODE'
          const fs = require("node:fs");
          const [manifestPath, version, provenancePath, sourceSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const provenance = fs.readFileSync(provenancePath, "utf8");
          const commit = provenance.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1];
          if (manifest.name !== "@kastrick/nextjs-engine" || manifest.version !== version || commit !== sourceSha) {
            throw new Error("Existing prerelease tag does not match the archive snapshot provenance.");
          }
          NODE
          else
            git tag -a "$TAG_NAME" -m "@kastrick/nextjs-engine $VERSION from $SOURCE_SHA" HEAD
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Dispatch archived prerelease GitHub Release builder
        if: \${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        env:
          TAG_NAME: \${{ steps.snapshot.outputs.version_tag }}
          GH_TOKEN: \${{ github.token }}
          GITHUB_API_URL: \${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(node - "$TAG_NAME" <<'NODE'
          const tagName = process.argv[2];
          if (!/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tagName)) {
            throw new Error("Refusing to dispatch an invalid prerelease tag: " + tagName);
          }
          process.stdout.write(JSON.stringify({
            event_type: "package-snapshot-published",
            client_payload: { tag_name: tagName }
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dispatches" \
            --data "$PAYLOAD"
          echo "Dispatched GitHub prerelease builder for $TAG_NAME."

      - name: Release summary
        if: always()
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          DIRECTORY: ${{ steps.snapshot.outputs.directory }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.channel.outputs.channel_tag }}
          SHOULD_PUBLISH: ${{ steps.registry-version.outputs.should_publish }}
        run: |
          {
            echo "## @kastrick/nextjs-engine archived release"
            echo "- Version: $VERSION"
            echo "- Track: $TRACK"
            echo "- Archive snapshot: $DIRECTORY"
            echo "- npm version dist-tag: $VERSION_TAG"
            echo "- Channel alias advanced: ${CHANNEL_TAG:-none}"
            echo "- New npm publication required: $SHOULD_PUBLISH"
          } >> "$GITHUB_STEP_SUMMARY"


  publish-tagged-snapshot:
    if: ${{ github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 45
    steps:
      - name: Checkout package archive
        uses: actions/checkout@v6
        with:
          ref: package/main
          fetch-depth: 0

      - name: Checkout exact-commit CI gate
        uses: actions/checkout@v6
        with:
          ref: main-3
          path: tooling
          fetch-depth: 1
          sparse-checkout: scripts/gen3-assert-green-commit.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js for npm Trusted Publishing and dist-tags
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false


      - name: Install npm CLI with OIDC support
        run: npm install --global npm@^11.21.0
      - name: Verify tag and resolve selected snapshot
        id: snapshot
        shell: bash
        env:
          DISPATCH_TAG: \${{ github.event.client_payload.tag_name || '' }}
        run: |
          set -euo pipefail
          TAG_NAME="\${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG_NAME" =~ ^package(-alpha|-beta)?\.[A-Za-z0-9.-]+$ ]] || {
            echo "Invalid package release tag: $TAG_NAME" >&2; exit 1;
          }
          git fetch --force --tags origin
          git fetch origin refs/heads/package/main:refs/remotes/origin/package/main
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}")" || {
            echo "Release tag is missing: $TAG_NAME" >&2; exit 1;
          }
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/package/main || {
            echo "Tag is not part of package/main history." >&2; exit 1;
          }
          if [[ "$TAG_NAME" =~ ^package-alpha\.([0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TRACK="alpha"
            MAJOR="${VERSION%%.*}"
            DIR="alpha/version/$MAJOR.alpha/version/$VERSION"
          elif [[ "$TAG_NAME" =~ ^package-beta\.([0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TRACK="beta"
            MAJOR="${VERSION%%.*}"
            DIR="beta/version/$MAJOR.beta/version/$VERSION"
          elif [[ "$TAG_NAME" =~ ^package\.([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TRACK="stable"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            SNAPSHOT="$VERSION"
            if [[ "$PATCH" == "0" ]]; then SNAPSHOT="$MAJOR.$MINOR"; fi
            DIR="version/$MAJOR.$MINOR/version/$SNAPSHOT"
          else
            echo "Unsupported release tag: $TAG_NAME" >&2; exit 1
          fi
          test -f "$DIR/package.json" && test -f "$DIR/index.ts" && test -d "$DIR/engine"
          if [[ "$TRACK" == "alpha" || "$TRACK" == "beta" || "$VERSION" =~ ^2\.7\.[0-9]+$ ]]; then
            test -f "$DIR/bin/ne.js" || { echo "Release requires the ne CLI, but $DIR/bin/ne.js is missing." >&2; exit 1; }
          fi
          export DIR VERSION TRACK
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          import path from "node:path";
          const {DIR,VERSION,TRACK}=process.env;
          const p=JSON.parse(fs.readFileSync(path.join(DIR,"package.json"),"utf8"));
          if(p.name!=="@kastrick/nextjs-engine"||p.version!==VERSION) throw new Error("Manifest mismatch: "+p.name+"@"+p.version);
          if(!fs.existsSync(path.join(DIR,"engine/index.ts"))) throw new Error("engine/index.ts is missing");
          const provenance=fs.readFileSync(path.join(DIR,"UPSTREAM.md"),"utf8");
          const sourceBranch=provenance.match(/^- Source branch:\s*\`?([A-Za-z0-9._/-]+)\`?\s*$/m)?.[1]||"";
          const sourceCommit=provenance.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1]||"";
          if(["alpha","beta"].includes(TRACK)&&(!/^main-[23]$/.test(sourceBranch)||!/^[0-9a-f]{40}$/.test(sourceCommit))) throw new Error("Prerelease provenance is missing a source branch/full commit.");
          const stable=[], alpha=[], beta=[];
          function walk(root){
            if(!fs.existsSync(root))return;
            for(const e of fs.readdirSync(root,{withFileTypes:true})){
              const full=path.join(root,e.name);
              if(e.isDirectory())walk(full);
              else if(e.name==="package.json"){
                const x=JSON.parse(fs.readFileSync(full,"utf8"));
                if(x.name!=="@kastrick/nextjs-engine")continue;
                if(/^\d+\.\d+\.\d+$/.test(x.version||""))stable.push(x.version);
                else if(/^\d+\.\d+\.\d+-alpha\.\d+$/.test(x.version||""))alpha.push(x.version);
                else if(/^\d+\.\d+\.\d+-beta\.\d+$/.test(x.version||""))beta.push(x.version);
              }
            }
          }
          walk("version");walk("alpha");walk("beta");
          const sortNums=(list, prerelease)=>list.sort((a,b)=>{
            const rx=prerelease?new RegExp("^([0-9]+)\\.([0-9]+)\\.([0-9]+)-"+prerelease+"\\.([0-9]+)$"):null;
            const A=rx?a.match(rx).slice(1).map(Number):a.split(".").map(Number);
            const B=rx?b.match(rx).slice(1).map(Number):b.split(".").map(Number);
            for(let i=0;i<A.length;i++)if(A[i]!==B[i])return A[i]-B[i];
            return 0;
          });
          sortNums(stable,null);sortNums(alpha,"alpha");sortNums(beta,"beta");
          const byTrack={stable,alpha,beta};
          const list=byTrack[TRACK];
          if(!list.length)throw new Error("No "+TRACK+" releases are archived.");
          const newest=list.at(-1);
          const versionTag=TRACK==="stable"?"package."+VERSION:TRACK==="alpha"?"package-alpha."+VERSION:"package-beta."+VERSION;
          const channelTag=newest===VERSION?(TRACK==="stable"?"latest":TRACK):"";
          console.log("version="+VERSION);
          console.log("track="+TRACK);
          console.log("directory="+DIR);
          console.log("version_tag="+versionTag);
          console.log("channel_tag="+channelTag);
          console.log("source_branch="+sourceBranch);
          console.log("source_commit="+sourceCommit);
          NODE

      - name: Require green runtime and browser CI for prereleases
        if: \${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_API_URL: \${{ github.api_url }}
          SOURCE_BRANCH: \${{ steps.snapshot.outputs.source_branch }}
          SOURCE_SHA: \${{ steps.snapshot.outputs.source_commit }}
          GH_TOKEN: \${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Validate and pack the selected snapshot
        working-directory: ${{ steps.snapshot.outputs.directory }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check
      - name: Publish Alpha/Beta snapshot as a GitHub Release (never to npm)
        if: ${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        id: github-prerelease
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ne-release"
          mkdir -p "$OUT"

          npm pack --ignore-scripts --pack-destination "$OUT" --json > "$OUT/pack.json"
          PACKED="$(node - "$OUT/pack.json" <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(result) || !result[0] || typeof result[0].filename !== "string") {
            throw new Error("npm pack did not produce a package filename.");
          }
          process.stdout.write(result[0].filename);
          NODE
          )"
          TARBALL="$OUT/nextjs-engine-$VERSION.tgz"
          mv "$OUT/$PACKED" "$TARBALL"
          SHA256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA-256 digest." >&2; exit 1; }

          node - "$VERSION" "$TRACK" "$TAG_NAME" "$SHA256" "$TARBALL" "$PWD/UPSTREAM.md" "$OUT/ne-release.json" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [version, track, tag, sha256, tarball, provenancePath, outputPath] = process.argv.slice(2);
          const provenance = fs.readFileSync(provenancePath, "utf8");
          const sourceBranch = provenance.match(/^- Source branch:\s*([A-Za-z0-9._/-]+)\s*$/m)?.[1];
          const sourceCommit = provenance.match(/^- Requested and resolved source commit:\s*([0-9a-f]{40})\s*$/m)?.[1];
          if (!sourceBranch || !sourceCommit) throw new Error("Snapshot provenance is missing its source branch or full commit SHA.");
          if (!["alpha", "beta"].includes(track)) throw new Error("Only Alpha/Beta artifacts belong in GitHub Releases.");
          if (track === "alpha" && !/-alpha\.\d+$/.test(version)) throw new Error("Invalid Alpha version: " + version);
          if (track === "beta" && !/-beta\.\d+$/.test(version)) throw new Error("Invalid Beta version: " + version);
          const manifest = {
            schemaVersion: 1,
            packageName: "@kastrick/nextjs-engine",
            version,
            track,
            tag,
            sourceBranch,
            sourceCommit,
            sha256,
            assetName: path.basename(tarball),
            floating: false,
            summary: "Validated " + track + " release pinned to " + sourceBranch + "@" + sourceCommit + ".",
          };
          fs.writeFileSync(outputPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE

          TRACK_UPPER="$(printf '%s' "$TRACK" | tr '[:lower:]' '[:upper:]')"
          NOTES="$OUT/release-notes.md"
          {
            echo "## Nextjs Engine $VERSION"
            echo
            echo "- Channel: **$TRACK_UPPER**"
            echo "- Artifact SHA-256: \`$SHA256\`"
            echo
            echo "<!-- NE-CHANNEL-MANIFEST-START -->"
            cat "$OUT/ne-release.json"
            echo "<!-- NE-CHANNEL-MANIFEST-END -->"
          } > "$NOTES"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            EXISTING="$OUT/existing"
            mkdir -p "$EXISTING"
            gh release download "$TAG_NAME" --pattern ne-release.json --dir "$EXISTING" || {
              echo "Release tag $TAG_NAME exists without a channel manifest; refusing to mutate it." >&2
              exit 1
            }
            node - "$EXISTING/ne-release.json" "$OUT/ne-release.json" <<'NODE'
          const fs = require("node:fs");
          const [existingPath, candidatePath] = process.argv.slice(2);
          const existing = JSON.parse(fs.readFileSync(existingPath, "utf8"));
          const candidate = JSON.parse(fs.readFileSync(candidatePath, "utf8"));
          for (const key of ["packageName", "version", "track", "tag", "sourceCommit", "sha256", "assetName"]) {
            if (existing[key] !== candidate[key]) {
              throw new Error("GitHub release " + candidate.tag + " is immutable; existing " + key + " differs. Publish a new prerelease version.");
            }
          }
          NODE
            if ! gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -Fxq "nextjs-engine-$VERSION.tgz"; then
              echo "GitHub release manifest exists but the package tarball asset is missing." >&2
              exit 1
            fi
            echo "This Alpha/Beta GitHub Release already contains the same pinned artifact; leaving it unchanged."
          else
            gh release create "$TAG_NAME" "$TARBALL" "$OUT/ne-release.json" \
              --title "Nextjs Engine $VERSION ($TRACK_UPPER)" \
              --notes-file "$NOTES" \
              --prerelease
          fi

      - name: Skip an already-published immutable npm version
        if: steps.snapshot.outputs.track == 'stable'
        id: registry-version
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm; skipping duplicate publication."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the selected snapshot
        if: steps.snapshot.outputs.track == 'stable' && steps.registry-version.outputs.should_publish == 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          DIST_TAG: ${{ steps.snapshot.outputs.version_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
      - name: Apply npm dist-tags
        if: steps.snapshot.outputs.track == 'stable'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.snapshot.outputs.channel_tag }}
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"; fi
