          node - "$DIR" "$VERSION" "$TRACK" "$VERSION_TAG" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const path = require("node:path");
          const [dir, version, track, versionTag] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
          if (manifest.name !== "@kastrick/nextjs-engine" || manifest.version !== version) {
            throw new Error("Archive manifest mismatch: " + manifest.name + "@" + manifest.version);
          }
          if (manifest.private === true) throw new Error("Archived package is marked private.");
          for (const file of ["index.ts", "tsconfig.json", "UPSTREAM.md", "engine/index.ts"]) {
            if (!fs.existsSync(path.join(dir, file))) throw new Error("Missing required file: " + file);
          }
          const provenance = fs.readFileSync(path.join(dir, "UPSTREAM.md"), "utf8");
          const sourceBranch = provenance.match(/^- Source branch:\s*\`?([A-Za-z0-9._/-]+)\`?\s*$/m)?.[1] || "";
          const sourceCommit = provenance.match(/^- (?:Requested and resolved source commit|Resolved source commit):\s*\`?([0-9a-f]{40})\`?\s*$/m)?.[1] || "";
          if (["alpha", "beta"].includes(track) && (!/^main-[23]$/.test(sourceBranch) || !/^[0-9a-f]{40}$/.test(sourceCommit))) {
            throw new Error("Alpha/Beta snapshot provenance must include a supported source branch and full source commit SHA.");
          }
          console.log("directory=" + dir);
          console.log("version=" + version);
          console.log("track=" + track);
          console.log("version_tag=" + versionTag);
          console.log("source_branch=" + sourceBranch);
          console.log("source_commit=" + sourceCommit);
          NODE

      - name: Require green runtime and browser CI for prereleases
        if: ${{ steps.snapshot.outputs.track == 'alpha' || steps.snapshot.outputs.track == 'beta' }}
        working-directory: tooling
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_BRANCH: ${{ steps.snapshot.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.snapshot.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen3-assert-green-commit.js

      - name: Type-check and inspect packed contents
        working-directory: ${{ steps.snapshot.outputs.directory }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check

      - name: Determine whether this release should advance a channel tag
        id: channel
        shell: bash
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
        run: |
          set -euo pipefail
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          node - "$VERSION" "$TRACK" "$RUNNER_TEMP/npm-dist-tags.json" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const [candidate, track, tagsPath] = process.argv.slice(2);
          const tags = JSON.parse(fs.readFileSync(tagsPath, "utf8"));

          function parse(v) {
            const m = String(v || "").match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/);
            if (!m) return null;
            return {
              core: m.slice(1, 4).map(Number),
              pre: m[4] ? m[4].split(".") : null
            };
          }
          function compare(aText, bText) {
            const a = parse(aText), b = parse(bText);
            if (!a) return -1;
            if (!b) return 1;
            for (let i = 0; i < 3; i++) {
              if (a.core[i] !== b.core[i]) return a.core[i] > b.core[i] ? 1 : -1;
            }
            if (a.pre === null && b.pre === null) return 0;
            if (a.pre === null) return 1;
            if (b.pre === null) return -1;
            const n = Math.max(a.pre.length, b.pre.length);
            for (let i = 0; i < n; i++) {
              if (i >= a.pre.length) return -1;
              if (i >= b.pre.length) return 1;
              if (a.pre[i] === b.pre[i]) continue;
              const an = /^\d+$/.test(a.pre[i]), bn = /^\d+$/.test(b.pre[i]);
              if (an && bn) return Number(a.pre[i]) > Number(b.pre[i]) ? 1 : -1;
              if (an !== bn) return an ? -1 : 1;
              return a.pre[i] > b.pre[i] ? 1 : -1;
            }
            return 0;
          }

          let channel = "";
          if (track === "stable") {
            if (compare(candidate, tags.latest) > 0) channel = "latest";
          } else if (track === "alpha" || track === "beta") {
            if (compare(candidate, tags[track]) > 0) channel = track;
          } else {
            throw new Error("Unsupported track: " + track);
          }
          console.log("channel_tag=" + channel);
          NODE

      - name: Skip an already-published immutable npm version
        id: registry-version
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
