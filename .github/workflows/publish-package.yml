          const track=tag.startsWith("package-alpha.")?"alpha":tag.startsWith("package-beta.")?"beta":"stable";
          const versionParts=version.match(/^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta)\.\d+)?$/);
          if(!versionParts) throw new Error("Invalid package SemVer: "+version);
          const [,major,minor,patch,prerelease]=versionParts;
          const expectedPath=track==="stable"&&!prerelease
            ? "version/"+major+"."+minor+"/version/"+(Number(patch)===0?major+"."+minor:version)
            : track+"/version/"+major+"."+track+"/version/"+version;
          if(marker.schemaVersion!==1||marker.packageName!=="@kastrick/nextjs-engine"
            ||marker.version!==version||marker.track!==track||marker.tag!==tag
            ||marker.layout!=="npm-pack-root"||marker.packagePath!==expectedPath
            ||!/^([0-9a-f]{40})$/.test(marker.archiveCommit||"")
            ||!(marker.sourceCommit===null||/^[0-9a-f]{40}$/.test(marker.sourceCommit||""))
            ||typeof marker.migrationOnly!=="boolean"
            ||!/^sha512-[A-Za-z0-9+/]+={0,2}$/.test(marker.npmIntegrity||"")) {
            throw new Error("Tag is not a verified package-root snapshot.");
          }
          if(pkg.name!=="@kastrick/nextjs-engine"||pkg.version!==version||pkg.private===true) {
            throw new Error("Package manifest does not match its Git tag.");
          }
          for(const file of ["index.ts","engine/index.ts"]) {
            if(!fs.existsSync(file)) throw new Error("Missing package file: "+file);
          }
          if(fs.readFileSync("index.ts","utf8").trim()!=='export * from "./engine";') {
            throw new Error("Package root index.ts does not re-export ./engine.");
          }
          console.log("version="+version);
          console.log("track="+track);
          console.log("archive_commit="+marker.archiveCommit);
          console.log("migration_only="+(marker.migrationOnly===true));
          NODE
          cat "$RUNNER_TEMP/tag-metadata.env" >> "$GITHUB_OUTPUT"
          VERSION="$(sed -n 's/^version=//p' "$RUNNER_TEMP/tag-metadata.env")"
          TRACK="$(sed -n 's/^track=//p' "$RUNNER_TEMP/tag-metadata.env")"
          ARCHIVE_COMMIT="$(sed -n 's/^archive_commit=//p' "$RUNNER_TEMP/tag-metadata.env")"
          MIGRATION_ONLY="$(sed -n 's/^migration_only=//p' "$RUNNER_TEMP/tag-metadata.env")"
