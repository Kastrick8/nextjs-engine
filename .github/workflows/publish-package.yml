          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const match=tag.match(/^package\.(\d+\.\d+\.\d+)$/)
            ||tag.match(/^package-alpha\.(\d+\.\d+\.\d+-alpha\.\d+)$/)
            ||tag.match(/^package-beta\.(\d+\.\d+\.\d+-beta\.\d+)$/);
