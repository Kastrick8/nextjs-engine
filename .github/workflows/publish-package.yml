            echo "The package-root tag's archive provenance is not part of package/main history." >&2; exit 1;
          }
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/current-dist-tags.json"
          export VERSION TRACK CURRENT_DIST_TAGS="$RUNNER_TEMP/current-dist-tags.json" ARCHIVE_ROOT="$GITHUB_WORKSPACE/archive"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          import path from "node:path";
          const {VERSION,TRACK,ARCHIVE_ROOT}=process.env;
          const registryTags=JSON.parse(fs.readFileSync(process.env.CURRENT_DIST_TAGS,"utf8"));
          const stable=[], alpha=[], beta=[];
          function walk(dir){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,e.name);
              if(e.isDirectory())walk(full);
              else if(e.name==="package.json"){
                const p=JSON.parse(fs.readFileSync(full,"utf8"));
                if(p.name!=="@kastrick/nextjs-engine")continue;
                if(/^\d+\.\d+\.\d+$/.test(p.version||""))stable.push(p.version);
                else if(/^\d+\.\d+\.\d+-alpha\.\d+$/.test(p.version||""))alpha.push(p.version);
                else if(/^\d+\.\d+\.\d+-beta\.\d+$/.test(p.version||""))beta.push(p.version);
              }
            }
          }
          walk(path.join(ARCHIVE_ROOT,"version"));
          walk(path.join(ARCHIVE_ROOT,"alpha","version"));
          walk(path.join(ARCHIVE_ROOT,"beta","version"));
          function compare(a,b){
            const parse=(v)=>v.split(/[-.]/).map((x)=>/^\d+$/.test(x)?Number(x):x);
            const aa=parse(a),bb=parse(b);
            for(let i=0;i<Math.max(aa.length,bb.length);i++){
              if(aa[i]===undefined)return -1;
              if(bb[i]===undefined)return 1;
              if(aa[i]===bb[i])continue;
              if(typeof aa[i]==="number"&&typeof bb[i]==="number")return aa[i]-bb[i];
              return String(aa[i]).localeCompare(String(bb[i]));
            }
            return 0;
          }
          stable.sort(compare);alpha.sort(compare);beta.sort(compare);
          const list={stable,alpha,beta}[TRACK];
          if(!list||!list.includes(VERSION))throw new Error("Tagged version is not present in package/main.");
          const versionTag=TRACK==="stable"?"package."+VERSION:"package-"+TRACK+"."+VERSION;
          const proposedChannel=TRACK==="stable"?"latest":TRACK;
          const newest=list.at(-1);
          const compareVersion=(a,b)=>compare(a||"0.0.0",b||"0.0.0");
          const channelTag=newest===VERSION
            &&compareVersion(VERSION,registryTags[proposedChannel])>=0
            ?proposedChannel:"";
          console.log("directory=.");
          console.log("version_tag="+versionTag);
          console.log("channel_tag="+channelTag);
          NODE
      - name: Validate and pack the selected snapshot
        if: steps.snapshot.outputs.migration_only != 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run type-check
          npm run pack:check
      - name: Skip an already-published immutable npm version
        id: registry-version
        if: steps.snapshot.outputs.migration_only != 'true'
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@kastrick/nextjs-engine@$VERSION" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version already exists on npm; skipping duplicate publication."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the selected snapshot
        if: steps.snapshot.outputs.migration_only != 'true' && steps.registry-version.outputs.should_publish == 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          DIST_TAG: ${{ steps.snapshot.outputs.version_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
      - name: Apply and verify npm dist-tags
        if: steps.snapshot.outputs.migration_only != 'true'
        working-directory: ${{ steps.snapshot.outputs.directory }}
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
          TRACK: ${{ steps.snapshot.outputs.track }}
          VERSION_TAG: ${{ steps.snapshot.outputs.version_tag }}
          CHANNEL_TAG: ${{ steps.snapshot.outputs.channel_tag }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="@kastrick/nextjs-engine@$VERSION"
          npm dist-tag add "$PACKAGE" "$VERSION_TAG"
          if [[ -n "$CHANNEL_TAG" ]]; then npm dist-tag add "$PACKAGE" "$CHANNEL_TAG"; fi
          npm view @kastrick/nextjs-engine dist-tags --json > "$RUNNER_TEMP/npm-dist-tags.json"
          node "$GITHUB_WORKSPACE/.github/scripts/verify-npm-dist-tags.mjs" "$RUNNER_TEMP/npm-dist-tags.json" "$VERSION" "$TRACK" "$VERSION_TAG" "$CHANNEL_TAG" "$GITHUB_WORKSPACE"
