name: Engine browser compatibility

on:
  push:
    branches: [main-3]
  pull_request:
    branches: [main-3]

permissions:
  contents: read

jobs:
  browser-compat:
    name: ${{ matrix.browser }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install ${{ matrix.browser }} browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Test ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload failed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-browser-${{ matrix.browser }}-traces
          path: test-results/
          if-no-files-found: ignore
