name: Seed package Git tags

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply package-only tag creation/migration (default is a dry run)."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seed-package-git-tags
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout package archive and version history
        uses: actions/checkout@v6
        with:
          ref: package/main
          path: archive
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate package-root tag helper
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/package-root-git-tags.mjs || {
            echo "The package-root helper is not on package/main yet. Merge the package-root tag implementation first." >&2
            exit 1
          }
          node --check .github/scripts/package-root-git-tags.mjs

      - name: Seed and migrate package-only Git tags
        working-directory: archive
        env:
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "true" ]]; then
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive" --seed --apply --push
          else
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive" --seed
          fi

      - name: Summarize package-tag operation
        if: always()
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          {
            echo "## Package-only Git tag seed"
            echo "- Mode: ${APPLY}"
            echo "- Apply requested: ${APPLY}"
            echo "- Operation: migrate existing tags and create missing version tags from their own archive snapshots"
            echo "- Legacy rewrites are migration-only and do not publish to npm"
          } >> "$GITHUB_STEP_SUMMARY"
