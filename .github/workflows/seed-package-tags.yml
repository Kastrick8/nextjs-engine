name: Seed package Git tags

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply package-only tag creation/migration (default is a dry run)."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seed-package-git-tags
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout package archive and version history
        uses: actions/checkout@v6
        with:
          ref: package/main
          path: archive
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate package-root tag helper
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/package-root-git-tags.mjs || {
            echo "The package-root helper is not on package/main yet. Merge the package-root tag implementation first." >&2
            exit 1
          }
          node --check .github/scripts/package-root-git-tags.mjs

      - name: Seed and migrate package-only Git tags
        working-directory: archive
        env:
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "true" ]]; then
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive" --seed --apply --push
          else
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive" --seed
          fi

      - name: Verify every version tag is package-root shaped
        if: inputs.apply
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          const tags=git("tag","--list").split("\n").filter(Boolean);
          const packageTags=tags.filter((tag)=>/^package\.\d+\.\d+\.\d+$/.test(tag)
            ||/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tag));
          if(!packageTags.length) throw new Error("No package version tags were found.");
          for(const tag of packageTags){
            const commit=git("rev-parse",tag+"^{commit}");
            const marker=JSON.parse(git("show",commit+":.package-tag.json"));
            const pkg=JSON.parse(git("show",commit+":package.json"));
            if(marker.layout!=="npm-pack-root"||marker.tag!==tag||marker.version!==pkg.version
              ||marker.packageName!=="@kastrick/nextjs-engine"||marker.migrationOnly!==true
              ||pkg.name!=="@kastrick/nextjs-engine") {
              throw new Error("Tag is not a valid migration-only package-root snapshot: "+tag);
            }
            const roots=git("ls-tree","--name-only",commit).split("\n");
            if(roots.includes("version")||roots.includes("alpha")||roots.includes("beta")||roots.includes(".github")) {
              throw new Error("Archive repository directories leaked into package tag "+tag);
            }
          }
          const latest=git("rev-parse","package.latest^{commit}");
          const stable=packageTags.filter((tag)=>/^package\.\d+\.\d+\.\d+$/.test(tag)).sort((a,b)=>{
            const av=a.slice("package.".length).split(".").map(Number);
            const bv=b.slice("package.".length).split(".").map(Number);
            for(let i=0;i<3;i++)if(av[i]!==bv[i])return av[i]-bv[i];
            return 0;
          });
          if(stable.length&&latest!==git("rev-parse",stable.at(-1)+"^{commit}")){
            throw new Error("package.latest does not point to the newest stable package-root tag.");
          }
          console.log("Verified "+packageTags.length+" package version tags and package.latest.");
          NODE

      - name: Summarize package-tag operation
        if: always()
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          {
            echo "## Package-only Git tag seed"
            echo "- Mode: ${APPLY}"
            echo "- Apply requested: ${APPLY}"
            echo "- Operation: migrate existing tags and create missing version tags from their own archive snapshots"
            echo "- Legacy rewrites are migration-only and do not publish to npm"
          } >> "$GITHUB_STEP_SUMMARY"
