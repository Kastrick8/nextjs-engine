name: Validate versioned package archive

on:
  push:
    branches: ["package/main"]
  pull_request:
    branches: ["package/main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && 'package/main') || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test npm dist-tag channel selection and verification
        run: node --test .github/scripts/verify-npm-dist-tags.test.mjs
      - name: Test package-root Git tag creation and migration
        run: node --test .github/scripts/package-root-git-tags.test.mjs
      - id: packages
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          import path from "node:path";
          const roots=["version","alpha/version","beta/version"];
          const packages=[];
          function walk(dir){
            if(!fs.existsSync(dir)) return;
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()) walk(full);
              else if(entry.isFile()&&entry.name==="package.json") packages.push(path.dirname(full).replaceAll("\\","/"));
            }
          }
          for(const root of roots) walk(root);
          packages.sort();
          if(packages.length===0) throw new Error("No versioned package snapshots found.");
          console.log("matrix="+JSON.stringify({package:packages}));
          NODE

  validate-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && 'package/main') || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate moving channel package layout
        shell: bash
        run: |
          set -euo pipefail
          DIR="alpha/channel/latest"
          if [[ ! -f "$DIR/package.json" ]]; then
            echo "No rolling Alpha package snapshot exists yet; skipping channel validation."
            exit 0
          fi
          cd "$DIR"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync("package.json","utf8"));
          if(p.name!=="@kastrick/nextjs-engine") throw new Error("Unexpected package name: "+p.name);
          if(!/^\d+\.\d+\.\d+-alpha\.\d+$/.test(p.version||"")) throw new Error("Rolling Alpha snapshot must use a full Alpha SemVer version.");
          if(p.private===true) throw new Error("Rolling Alpha package must not be private.");
          for(const file of ["index.ts","engine/index.ts","tsconfig.json","UPSTREAM.md"]) {
            if(!fs.existsSync(file)) throw new Error("Missing rolling package file: "+file);
          }
          if(fs.readFileSync("index.ts","utf8").trim()!=='export * from "./engine";') {
            throw new Error("Root entrypoint must re-export ./engine.");
          }
          for(const [name,value] of Object.entries(p.exports||{})) {
            const targets=typeof value==="string"?[value]:[value.types,value.import,value.require,value.default].filter(Boolean);
            for(const target of targets) if(!fs.existsSync(target.replace(/^\.\//,""))) throw new Error("Export "+name+" targets missing file "+target);
          }
          NODE
      - name: Install rolling package validation dependencies
        if: hashFiles('alpha/channel/latest/package.json') != ''
        working-directory: alpha/channel/latest
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Type-check rolling package
        if: hashFiles('alpha/channel/latest/package.json') != ''
        working-directory: alpha/channel/latest
        run: npm run type-check
      - name: Verify rolling npm pack contents
        if: hashFiles('alpha/channel/latest/package.json') != ''
        working-directory: alpha/channel/latest
        run: npm run pack:check

  validate:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && 'package/main') || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate manifest, local entrypoint and exports
        working-directory: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const p=JSON.parse(fs.readFileSync("package.json","utf8"));
          if(p.name!=="@kastrick/nextjs-engine") throw new Error("Unexpected package name: "+p.name);
          if(!p.version) throw new Error("Missing full package version");
          if(!fs.existsSync("index.ts")||!fs.existsSync("engine/index.ts")) throw new Error("Snapshot entrypoint missing");
          const version=p.version.match(/^(\d+)\.(\d+)\.(\d+)(-(alpha|beta)\.\d+)?$/);
          if(!version) throw new Error("Manifest version is not full SemVer: "+p.version);
          const expectedDir=version[4]?p.version:(Number(version[3])===0?`${version[1]}.${version[2]}`:p.version);
          const expectedFamily=version[4]?`${version[1]}.${version[5]}`:`${version[1]}.${version[2]}`;
          const actualDir=path.basename(process.cwd());
          const actualFamily=path.basename(path.dirname(path.dirname(process.cwd())));
          if(actualDir!==expectedDir) throw new Error(`Snapshot folder ${actualDir} does not match expected ${expectedDir} for ${p.version}`);
          if(actualFamily!==expectedFamily) throw new Error(`Snapshot family ${actualFamily} does not match expected ${expectedFamily} for ${p.version}`);
          for(const [name,value] of Object.entries(p.exports||{})){
            const values=typeof value==="string"?[value]:[value.types,value.import,value.require,value.default].filter(Boolean);
            for(const target of values){
              if(!fs.existsSync(target.replace(/^\.\//,""))) throw new Error(`Export ${name} targets missing file ${target}`);
            }
          }
          NODE
      - name: Install package validation dependencies
        working-directory: ${{ matrix.package }}
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Type-check snapshot
        working-directory: ${{ matrix.package }}
        run: npm run type-check
      - name: Verify npm pack contents
        working-directory: ${{ matrix.package }}
        run: npm run pack:check
