name: Migrate package Git tags to package-only snapshots

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the package-root migration and force-update existing version tags (otherwise dry-run)."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: migrate-package-git-tags
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout package archive and all existing tags
        uses: actions/checkout@v6
        with:
          ref: package/main
          path: archive
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate migration helper and discover package tags
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/package-root-git-tags.mjs
          node --check .github/scripts/package-root-git-tags.mjs
          git tag --list 'package.[0-9]*' 'package-alpha.[0-9]*' 'package-beta.[0-9]*'
          node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive"

      - name: Migrate existing Git tags
        working-directory: archive
        env:
          APPLY: \${{ inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPLY" == "true" ]]; then
            echo "Applying package-only Git tag migration."
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive" --apply --push
          else
            echo "Dry-run only. No Git refs will be changed."
            node .github/scripts/package-root-git-tags.mjs migrate "$GITHUB_WORKSPACE/archive"
          fi

      - name: Verify every package version tag is package-root shaped
        if: inputs.apply
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const tags=execFileSync("git",["tag","--list"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
          const packageTags=tags.filter((tag)=>/^package\.\d+\.\d+\.\d+$/.test(tag)
            ||/^package-(?:alpha|beta)\.\d+\.\d+\.\d+-(?:alpha|beta)\.\d+$/.test(tag));
          if(!packageTags.length) throw new Error("No package version tags were found.");
          for(const tag of packageTags){
            const commit=execFileSync("git",["rev-parse",tag+"^{commit}"],{encoding:"utf8"}).trim();
            const marker=JSON.parse(execFileSync("git",["show",commit+":.package-tag.json"],{encoding:"utf8"}));
            const pkg=JSON.parse(execFileSync("git",["show",commit+":package.json"],{encoding:"utf8"}));
            if(marker.layout!=="npm-pack-root"||marker.tag!==tag||marker.version!==pkg.version
              ||marker.packageName!=="@kastrick/nextjs-engine"||pkg.name!=="@kastrick/nextjs-engine") {
              throw new Error("Tag is not a valid package-root snapshot: "+tag);
            }
            const roots=execFileSync("git",["ls-tree","--name-only",commit],{encoding:"utf8"}).trim().split("\n");
            if(roots.includes("version")||roots.includes("alpha")||roots.includes("beta")||roots.includes(".github")) {
              throw new Error("Archive repository directories leaked into package tag "+tag);
            }
          }
          const latest=execFileSync("git",["rev-parse","package.latest^{commit}"],{encoding:"utf8"}).trim();
          const stable=packageTags.filter((tag)=>/^package\.\d+\.\d+\.\d+$/.test(tag)).sort((a,b)=>{
            const av=a.slice("package.".length).split(".").map(Number);
            const bv=b.slice("package.".length).split(".").map(Number);
            for(let i=0;i<3;i++)if(av[i]!==bv[i])return av[i]-bv[i];
            return 0;
          });
          if(stable.length&&latest!==execFileSync("git",["rev-parse",stable.at(-1)+"^{commit}"],{encoding:"utf8"}).trim()){
            throw new Error("package.latest does not point to the newest stable package-root tag.");
          }
          console.log("Verified "+packageTags.length+" package version tags and package.latest.");
          NODE
