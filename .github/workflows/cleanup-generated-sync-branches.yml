name: Cleanup generated package-sync branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; turn off to delete matching refs"
        type: boolean
        required: true
        default: true
      confirm:
        description: "Type DELETE-GENERATED-SYNC-BRANCHES to enable deletion"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ inputs.dry_run == true || inputs.confirm == 'DELETE-GENERATED-SYNC-BRANCHES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === "true";
            const confirm = process.env.CONFIRM || "";
            if (!dryRun && confirm !== "DELETE-GENERATED-SYNC-BRANCHES") {
              throw new Error("Refusing deletion without explicit typed confirmation.");
            }
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            const openHeads = new Set(pulls.map((pull) => pull.head.ref));
            const matcher = /^sync\/main-3-package-[0-9a-f]{7}-[0-9]+$/;
            const candidates = branches.filter((branch) => !branch.protected && matcher.test(branch.name));
            const deleted = [];
            const skipped = branches.filter((branch) => matcher.test(branch.name) && (branch.protected || openHeads.has(branch.name)))
              .map((branch) => ({ name: branch.name, reason: branch.protected ? "protected branch" : "used by an open PR" }));
            const preview = [];
            const failed = [];
            for (const branch of candidates) {
              if (openHeads.has(branch.name)) {
                skipped.push({ name: branch.name, reason: "used by an open PR" });
                continue;
              }
              if (dryRun) {
                preview.push(branch.name);
                continue;
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: "heads/" + branch.name });
                deleted.push(branch.name);
              } catch (error) {
                failed.push({ name: branch.name, reason: String(error.message || error) });
              }
            }
            core.summary.addHeading("Generated package-sync branch cleanup")
              .addTable([
                [{ data: "Result", header: true }, { data: "Count", header: true }],
                ["Matching candidates", String(candidates.length)],
                ["Would delete (dry run)", String(preview.length)],
                ["Deleted", String(deleted.length)],
                ["Skipped", String(skipped.length)],
                ["Failed", String(failed.length)]
              ])
              .addHeading("Preview")
              .addList(preview.map((name) => "`" + name + "`"))
              .addHeading("Deleted")
              .addList(deleted.map((name) => "`" + name + "`"))
              .addHeading("Skipped")
              .addList(skipped.map((item) => "`" + item.name + "`: " + item.reason))
              .addHeading("Failed")
              .addList(failed.map((item) => "`" + item.name + "`: " + item.reason))
              .write();
            core.info("Matched " + candidates.length + " eligible generated refs.");
            if (failed.length) throw new Error(failed.length + " branch deletion(s) failed.");
