name: Cleanup generated package-sync branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; turn off to delete matching refs"
        type: boolean
        required: true
        default: true
      confirm:
        description: "Type DELETE-GENERATED-SYNC-BRANCHES to enable deletion"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: ${{ inputs.dry_run || inputs.confirm == 'DELETE-GENERATED-SYNC-BRANCHES' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preview or delete only generated package-sync refs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$CONFIRM" != "DELETE-GENERATED-SYNC-BRANCHES" ]]; then
            echo "Confirmation mismatch; refusing to delete refs." >&2; exit 1
          fi
          mapfile -t BRANCHES < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -E '^sync/main-3-package-[0-9a-f]{7}-[0-9]+$' || true)
          mapfile -t OPEN_PR_HEADS < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].head.ref')
          echo "Matching generated refs: ${#BRANCHES[@]}"
          deleted=0; skipped=0; failed=0
          for branch in "${BRANCHES[@]}"; do
            if printf '%s\n' "${OPEN_PR_HEADS[@]}" | grep -Fxq "$branch"; then
              echo "SKIP open PR uses branch: $branch"; skipped=$((skipped+1)); continue
            fi
            if [[ "$DRY_RUN" == "true" ]]; then echo "DRY RUN would delete: $branch"; continue; fi
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "DELETED: $branch"; deleted=$((deleted+1))
            else
              echo "FAILED (possibly protected or permission denied): $branch"; failed=$((failed+1))
            fi
          done
          {
            echo "## Generated branch cleanup"
            echo "- Matching refs: ${#BRANCHES[@]}"
            echo "- Deleted: $deleted"
            echo "- Skipped due to open PR: $skipped"
            echo "- Failed: $failed"
            echo "- Dry run: $DRY_RUN"
            echo
            echo "Only refs matching `sync/main-3-package-<7-hex-sha>-<attempt>` were eligible."
          } >> "$GITHUB_STEP_SUMMARY"
